---
name: random_face_table_video
type: recipe
version: 1
title: 随机人脸×胸压桌沿咖啡座实拍照 → 5 秒生活感视频
doc: random_face_table_video.md
seed: 0
refs:
- from: pick
  step: 随机选脸
  label: 脸部参考
steps:
- kind: pick
  label: 随机选脸
  manual: false
  face:
    sources: [face-db-01]
    section: face

- kind: adhoc_image
  label: 首帧图
  aspect: "3:4"
  reference_labels: [脸部参考]
  prompt: |
    以<image1>中的人物为唯一主体，生成一张竖版 3:4 的生活感实拍快照。

    人物身份：
    保留<image1>中人物的五官特征、脸型、肤色与个人辨识度，不将人物替换成统一网红脸。发型与发色也保留<image1>中的样子。人物为成年女性（约二十五岁），真人照片质感。

    场景与服装：
    海边咖啡店的露天平台座位，木质方桌，午后暖色阳光，背景可见浅色栏杆与远处泛光的海面，虚化处理，没有其他人物入镜。人物穿着一件浅米色的宽松针织长袖上衣，面料柔软有厚度。

    姿势与身体：
    人物坐在桌前的椅子上，上半身微微前倾，胸的下部直接压放在木质桌面上。胸的重量压在桌沿，下侧与桌面接触并被自然托起顶起；胸和桌面之间没有任何缝隙，不是悬空或从桌沿垂下来的状态。胸前衣服因身体与桌面的接触出现自然的压迫痕迹和细小褶皱。双臂自然垂放在身体两侧，双手放在自己的大腿上，肩颈放松。

    表情与视线：
    脸微微向画面一侧偏，露出轻松自然的微笑，视线朝向镜头方向。

    构图与镜头：
    相机隔着桌子正对人物，高度与就坐人物的胸口齐平，以人物上半身为中心的竖版中景，桌沿横在画面下方。不是俯拍，相机不高于人物胸口。像朋友用手机随拍的自然快照，画面轻微的生活感，无加工感。

    光线与质感：
    暖色室内外混合光，柔和自然，人物面部与衣服褶皱清楚可见。真实摄影质感，轻微胶片颗粒，无文字、无水印、无拼图效果。

    最终画面：
    只出现一名人物，人体比例与肢体结构自然，胸前与桌面的接触关系清楚可信。

- kind: video_model
  label: 成片
  frame_from: 首帧图
  frame_slot: first_frame
  duration: 5
  aspect: "3:4"
  wait_s: 420
  prompt: |
    以输入首帧为唯一视觉依据，生成一段约 5 秒的单人生活感短视频。

    画面连续性：
    从输入首帧的坐姿直接开始。保持首帧中人物的身份、五官、发型、体型、服装、姿势、背景与光线完全一致。全程只有同一名人物，服装款式颜色不变、背景不变。

    镜头：
    竖版 3:4，隔着桌子正对人物、与胸口齐高的固定机位，一镜到底。不推拉、不摇移、不切镜头，桌沿始终横在画面下方同一位置。

    动态整体：
    人物保持「胸压桌面」的姿势不变：胸的下部与桌面的接触点全程不离开桌面，衣服上的压迫痕迹与褶皱保持连贯。画面只有小幅自然动态——呼吸带来的胸口与肩部轻微起伏、身体一点点放松微动、嘴角笑意加深然后轻轻笑出、刘海和发梢被海风微微吹动。人物偶尔自然眨眼，视线一直朝向镜头方向，神态放松愉悦。

    环境动态：
    背景海面有轻微的波光变化，远处天空的云几乎不动；人物身前的桌面、桌上的杯具等保持静止。

    动作顺序：
    0—1.5 秒：呼吸起伏，保持微笑看向镜头；
    1.5—3 秒：嘴角笑意加深，头轻轻向一侧小幅度偏动，发丝随动；
    3—5 秒：轻轻放松下来，身体微微回正一点点，嘴角保持浅笑，在余韵中自然结束，不突然僵住。

    避免出现：
    人物起身或站起、胸离开桌面、手臂大幅度抬起、转身、镜头移动或变焦、人物外观/服装/背景发生变化、出现第二个人、画面卡顿或静止不动。
