steps:
- kind: adhoc_image
  label: 首帧图
  prompt: |
    以<image1>中的人物为唯一主体，生成一张用于后续猫爪舞视频首帧的单人竖版图片。

    人物身份与画风：
    保留<image1>中人物的五官特征、脸型、发型、发色、肤色、原有体型与个人辨识度，不替换成统一的网红脸，不改变人物的性别表达。真人照片保持自然真实的摄影质感，绘画角色保持原有绘画风格。

    人物服装：
    沿用<image1>中人物原有的服装，保持可见的款式、颜色、领口、袖型和图案。原图未展示的部分自然延续已有服装设计。双手不持物，不额外添加猫耳、尾巴、手套或其他动物装饰。

    构图与镜头：
    9:16竖版，正面平视，单人居中，完整展示头顶至大腿中段。头顶留出少量空间，双肩、双肘、双手完整入镜，身体两侧留出摆臂空间。人物躯干正对镜头，肩膀放松，不侧身，不采用俯拍、仰拍或广角畸变。

    起始姿态：
    人物自然站立，双腿略微分开，膝盖放松，身体重心位于中间。双臂屈肘，肘部位于身体两侧，双手分开放在胸前下方，左右高度基本一致。

    双手做放松的小猫爪姿态：手指自然向掌心弯曲，形成松松的半握拳，拇指自然收在手侧，不用力攥紧；手腕轻微向下弯，呈现可爱的垂爪轮廓。双手之间保持明显间隔，不相碰，不交叉，不遮挡面部。双手距离身体较近，不向镜头伸出。

    表情与视线：
    人物看向镜头，头部基本端正，嘴角带一点俏皮浅笑，眼神自然灵动。不要提前歪头或做夸张表情，为后续舞蹈留出变化。

    背景与光线：
    明亮简洁的室内背景，浅色墙面，没有其他人物、镜面反射或杂乱物品。光线柔和均匀，人物面部、双手和服装清晰可见。

    最终画面：
    像人物已经摆好猫爪，准备下一刻跟着节奏跳舞。人体比例自然，手部结构清楚，没有文字、水印、拼图或动作残影。
  backend: comfyui
  aspect: "9:16"
  reference_labels: [front]

- kind: video_model
  label: 直出片段
  prompt: |
    以输入首帧为唯一视觉依据，生成一段约5秒的单人猫爪弹弹舞视频。

    画面连续性：
    从输入首帧的姿态直接开始，保持人物的身份、五官、发型、体型、服装、背景、光线与整体画风一致。全程只有同一名人物，不新增猫耳、尾巴、手套或其他装饰。

    镜头：
    9:16竖版，正面平视固定镜头，一镜到底。保持首帧中头顶至大腿中段的构图和人物大小，不推拉、不摇移、不切镜头。人物始终位于画面中央附近，双肘和双手保持在画面内。

    舞蹈整体：
    人物面向镜头，完成一段轻快、可爱、带有小猫撒娇感的舞蹈。双手从头到尾保持松松的半握拳猫爪形状（任何段落手型不变，五指不张开），配合屈肘摆动、膝盖轻弹和小幅左右重心变化。动作清楚而连贯，不走动、不跳跃、不转身，不做夸张扭腰顶胯。

    动作顺序：

    0—1.2秒，双爪轻探：
    从首帧胸前的猫爪姿态开始，双膝轻轻一弹，双手同时向前下方短短地探出，再收回胸前。随后再做一次同样的小幅前探与收回。
    双肘始终弯曲，不伸直手臂，不把手推近镜头，不张开五指。两次前探都有清楚的伸出和回收过程，像小猫轻轻伸爪。

    1.2—2.8秒，交替小猫拳：
    双手留在胸前，拳心大致朝向身体。一只猫爪轻轻抬高，另一只轻轻放低，随后交换高低，连续交替摆动。
    两只猫爪各自沿短小的上下路径运动，不相碰、不交叉，不变成向前出拳。肩膀随动作轻轻交替起伏，膝盖保持柔和弹动，头部自然跟随。

    2.8—4秒，双爪左右摇：
    双手回到相近高度，摆动时仍保持半握拳猫爪形状，一起轻轻摆向画面左侧，再摆向画面右侧。
    身体重心和肩膀小幅跟随，形成俏皮的左右摇摆。双手保持分开，移动范围在胸前附近，脸部始终朝向镜头，笑容逐渐明显。

    4—5秒，脸旁猫爪亮相：
    双手从胸前沿面部两侧缓缓抬起，停在脸颊外侧约一拳距离的位置，完全离开面部轮廓，不触碰皮肤，不捧脸，不挡住眼睛和嘴。
    双手仍保持半握拳猫爪形状，不张开五指。头部轻轻向一侧倾斜，露出俏皮、开心的笑容。肩膀顺势轻弹一下，在少量自然余动中结束，不突然冻结。

    动作衔接：
    整段舞蹈连续完成，前一个动作自然带出后一个动作，不在各段之间停下来重新摆姿势。动作轻巧，不急促甩动。头发和衣物随身体产生轻微自然的跟随变化。

    手部要求：
    双手始终保持自然放松的半握拳猫爪，不反复张合手指，不变成比心、指人或复杂手势。手腕只做轻微弯曲，不过度折弯。亮相阶段同样保持猫爪半握；双手与脸始终留出明显间隔。

    避免出现：
    手部快速贴近镜头、手臂经过面部中央、双手交叉纠缠、五指张开摊平、手贴脸或捧脸、大幅甩头、突然转身、张嘴对口型，以及人物外观、服装或背景发生变化。
  frame_from: 首帧图
