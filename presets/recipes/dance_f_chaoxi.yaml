- kind: adhoc_image
  label: 首帧图
  prompt: |
    以<image1>中的人物为唯一主体，生成一张用于后续节奏手势舞视频首帧的单人竖版图片。

    人物身份与画风：
    保留<image1>中人物的五官特征、脸型、发型、发色、肤色、原有体型与个人辨识度，不替换成明星脸或统一的网红脸，不改变人物的性别表达。
    真人照片保持自然真实的摄影质感，绘画角色保持原有绘画风格。

    人物服装：
    沿用<image1>中人物原有的服装，保持可见的款式、颜色、领口、袖型和图案。原图未展示的部分自然延续已有设计。
    不要强制换成西装，不额外添加墨镜、首饰、手套或其他配饰。人物双手不持物。

    构图与镜头：
    9:16竖版，正面平视，单人居中，完整展示头顶至大腿中段，画面下缘止于大腿中段，膝盖、小腿和双脚不入镜。头顶留出少量空间，身体两侧预留屈肘侧推的活动空间，双肩、双肘和双手完整入镜。
    人物躯干正对镜头，不侧身，不俯拍、不仰拍，不使用广角畸变。

    起始姿态：
    人物自然站立，双腿略微分开，双膝放松，身体重心位于中间。上身直立而松弛，肩膀自然下沉，不耸肩，不挺胸后仰。

    双臂屈肘，双肘位于身体两侧并略微离开躯干。双手分开放在胸前下方，位置略低于胸口，两手之间保留清楚间隔，前臂不交叉。
    双手像捧着一个看不见的球那样抬起来：手腕抬到胸口正下方、明显在腰带上方一带的高度，前臂从肘部向上斜抬，不向下垂放；两手掌心斜向前、指尖斜向上，之间隔着差不多一个球的宽度，不搭在腰带或裙子上。
    双手自然舒展，手指略微并拢，指尖斜向上，掌心斜向前，手腕基本平直。双手距离身体较近，不向镜头伸出。
    整体是即将开始一组左右侧推手势舞的准备姿态，不提前比耶，不握拳，不做猫爪。

    表情与视线：
    人物直视镜头，下巴自然放平，头部端正。表情自信、放松，嘴角带很淡的笑意。不要皱眉装凶，不提前歪头，不张嘴，不挤眼。

    背景与光线：
    简洁明亮的室内背景，浅色墙面，没有其他人物、镜面反射或杂乱物品。光线柔和均匀，面部、双手与服装清楚可见，不添加舞台闪光或彩色光束。

    最终画面：
    呈现人物从容准备开始跳舞的瞬间。人体比例自然，手部结构清楚，服装轮廓完整，没有文字、水印、拼图或动作残影。
  backend: comfyui
  aspect: "9:16"
  reference_labels: [front]

- kind: video_model
  label: 直出片段
  prompt: |
    以输入首帧为唯一视觉依据，生成一段约5秒的单人节奏手势舞视频。

    画面连续性：
    从输入首帧的姿态直接开始。保持人物的身份、五官、发型、体型、服装、背景、光线和整体画风一致。全程只有同一名人物，不换装，不新增配饰或道具。

    镜头：
    9:16竖版，正面平视固定镜头，一镜到底。
    保持首帧中头顶至大腿中段的构图和人物大小，不推拉、不摇移、不切镜头。人物始终位于画面中央附近，双肘和双手保持在画面内。

    整体表演：
    人物面向镜头，完成一小段干净、轻快、松弛而自信的手势舞。
    主要动作是双手左右侧推与回收，配合小幅膝盖弹动、肩膀律动和胸口转动。动作有明确的推出与收回，不是缓慢地搬动双手，也不是用力出拳。

    双脚留在原地附近，不走动、不跳跃、不转身。躯干保持基本正面，只做小幅跟随，脸部始终朝向镜头。

    动作顺序：

    0—1.6秒，向画面左侧推收：
    从首帧胸前下方的双手姿态直接开始，双膝轻轻弹动。
    像隔空推开一件看不见的东西：双手掌心转向画面左侧，保持分开、间距不变，从胸前下方一起向画面左侧推出去，双手停在身体左侧、离躯干大约一掌远的位置，高度在胸口附近。
    之后双手并排收回胸前下方原位，身体回正——一次完整的「推出—收回」。
    两点硬规则：双手全程并排一起动，间距始终不变，不是单手伸出、不是两手轮流；双肘保持弯曲，不把手臂完全伸直，推收全程双手不超过锁骨高度、不抬高到脸旁，不越过画面边缘，不向镜头推近。
    推出时肩膀和胸口随双手小幅朝左转，收回来时身体回正，推出干净，回收柔和，脸始终朝镜头。

    1.6—3.4秒，向画面右侧推收：
    接着用同样的方式向另一侧完成：双手掌心转向画面右侧，保持间距不变，并排一起向画面右侧推出去，双手停在身体右侧、离躯干大约一掌远的位置，高度在胸口附近，再并排收回胸前下方原位。
    双手不相碰、不交叉，躯干不做大幅扭转；肩膀与胸口自然小幅跟随，重心小幅向右移动，再回到中央。
    脸部仍然朝向镜头，不随身体转成侧脸。动作与前一侧连贯衔接，不停下来重新准备。

    3.4—5秒，肩旁比耶亮相：
    双手从胸前自然落向腰部上方。
    一只手留在腰部附近，另一只手顺势抬到同侧肩膀外侧，手肘向下沉，伸出食指和中指形成自然的V形手势，其余手指自然弯曲。
    比耶的手肘下沉、停在肩膀外侧的高度：手指顶端大约与眼睛齐平、明显低于头顶，与脸颊保持清楚间隔，不贴脸，不遮住眼睛，不伸向镜头。

    双手必须在4.3秒前落定位置：一只手在腰部、另一只手在肩旁比耶到位。
    4.3—5秒保持这个亮相不再移动，不再抬高手指，只顺势轻轻点头一次，肩膀保留少量节奏回弹，嘴角浮现自然、自信的浅笑。看向镜头，在松弛的亮相状态中结束，不突然冻结，不额外追加动作。

    动作衔接：
    左侧推收自然接右侧推收，再接单手比耶亮相，整段连续完成。
    推收两段全程双手不超过锁骨高度，主要在胸口以下和身体两侧运动，最后只有一只手抬到肩旁（收尾比耶是唯一抬高例外）。手臂不经过面部中央，前臂不交叉，不做复杂绕腕。
    头发和衣物随身体运动产生轻微自然的跟随变化。

    表情：
    全程保持放松、自信，不刻意装凶，不频繁挑眉，不做夸张卖萌表情。嘴唇自然，不说话，不对口型。

    避免出现：
    双手向镜头猛推、手臂完全绷直、连续出拳、双臂交叉、大幅身体波浪、躯干大幅扭转、单手单独大幅伸展、双手举到脸旁做挥手动作（收尾的肩旁比耶不算）、深蹲、转圈、甩头、突然新增比心或猫爪动作，以及人物外观、服装或背景发生变化。
  frame_from: 首帧图
  frame_slot: first_frame
  model: heygen/heygen-video-1
  duration: 5
  resolution: 480p
  aspect: "9:16"
  wait_s: 420