- kind: adhoc_image
  label: 首帧图
  prompt: |
    以<image1>中的人物为唯一主体，生成一张用于后续轻盈摇摆舞视频首帧的单人竖版图片。

    人物身份与画风：
    保留<image1>中人物的五官特征、脸型、发型、发色、肤色、原有体型与个人辨识度，不将人物替换成明星脸或统一的网红脸，不改变人物的性别表达。真人照片保持自然真实的摄影质感，绘画角色保持原有绘画风格。

    人物服装：
    沿用<image1>中人物原有的服装，保持可见的款式、颜色、领口、袖型和图案。原图未展示的部分自然延续已有设计。不要擅自换成古装，不新增披帛、长袖、头饰或其他配饰。人物双手不持物。

    构图与镜头：
    9:16竖版，正面平视，单人居中，完整展示头顶至大腿中段。人物在画面中的大小适中，身体两侧留出明显的展开手臂空间，不采用贴近身体的狭窄裁切。双肩、双肘和双手完整入镜。人物躯干正对镜头，不侧身，不俯拍、不仰拍，不使用广角畸变。

    起始姿态：
    人物自然站立，双腿略微分开，双膝放松，身体重心位于中间。上身直立，肩膀自然下沉，不挺胸后仰，不耸肩。

    双臂自然屈肘，肘部位于身体两侧并略微离开腰部。两只手分开放在胸前下方，手的位置略高于腰部。掌心斜向下，指尖朝向前方，手指自然舒展并略微并拢，拇指放松，手腕基本平直。

    两只手之间留有清楚间隔，不相碰、不交叉、不叠放。整体像双手即将从身体前方向两侧轻轻展开的准备姿态，而不是正在比心、抱拳或做猫爪。

    表情与视线：
    人物看向镜头，头部基本端正，嘴角带轻松、自信的浅笑，眼神有一点俏皮。不要提前歪头，不张大嘴，不挤眼。

    背景与光线：
    明亮简洁的室内背景，浅色墙面，没有其他人物、镜面反射或杂乱物品。柔和均匀的正面光线，脸部、双手和服装清楚可见。

    最终画面：
    呈现人物即将开始一段轻盈舞蹈的瞬间。人物比例自然，双臂和手部结构清楚，服装轮廓完整，没有文字、水印、拼图或动作残影。
  backend: comfyui
  aspect: "9:16"
  reference_labels: [front]

- kind: video_model
  label: 直出片段
  prompt: |
    以输入首帧为唯一视觉依据，生成一段约5秒的单人轻盈摇摆舞视频。

    画面连续性：
    从输入首帧的姿态直接开始。保持人物的身份、五官、发型、体型、服装、背景、光线和整体画风一致。全程只有同一名人物，不换装，不新增头饰、披帛、道具或其他装饰。

    镜头：
    9:16竖版，正面平视固定镜头，一镜到底。全程保持首帧中头顶至大腿中段的构图与人物大小，人物在画面里的占比从头到尾不变，手臂展开也不因此缩小人物或拉远镜头；地面与鞋底下的阴影不要额外入镜。不推拉、不摇移、不切镜头。人物始终位于画面中央附近，展开手臂时双肘与双手完整留在画面内，双手内侧到画面左右边缘始终留出一掌宽的空白，不触边、不出画。

    舞蹈整体：
    人物面向镜头，完成一小段轻盈、俏皮、舒展的舞蹈。主要运动来自双臂向两侧展开、前臂交替轻抬、肩膀随动和小幅重心变化。动作柔和但有明确节奏，不拖沓，不是缓慢摆拍。

    双脚留在原地附近，不走动、不跳跃、不转圈。躯干大部分时间正对镜头，脸部保持朝向镜头，不大幅扭腰，不后仰。

    动作顺序：

    0—1.5秒，轻轻展翅：
    从首帧双手分开放在胸前下方的姿态开始，双膝轻轻屈伸，身体小幅回弹。
    双手同时向各自一侧展开，肘部随之离开身体，形成柔和、舒展的双臂轮廓。
    整个展开过程双肘都柔和弯曲，肘部位置始终低于肩膀；双手沿着腰侧到肩侧之间的路径向两侧打开，展开结束时双手停在躯干两侧约一掌半距离的位置，手掌大致垂直向下、掌心斜向下，前臂自然放松。不要把双臂伸直绷成一条水平直线，双手不要抬到肩膀以上，不要碰到画面左右边缘，不向镜头伸手。

    1.5—3.5秒，左右轻摇：
    保持双臂向两侧展开、双肘弯曲的基本轮廓。
    画面左侧的前臂与手先轻轻抬高，另一侧略微放低；随后交换高低，画面右侧的前臂与手轻轻抬高，另一侧略微放低。
    两侧的高度变化适中，双手不超过头部，不垂落到腰部以下。手腕随前臂轻轻起伏，不独立快速翻转，不做复杂绕腕。

    身体重心随动作先向画面左侧轻移，再向画面右侧轻移，肩膀自然跟随。头部只有少量随动，眼神仍看向镜头，笑容逐渐明显。整体像展开的翅膀轻轻起伏，不是快速扑扇手臂。

    3.5—4.3秒，双臂收回：
    展开的双臂必须在4.3秒前收回到位：从两侧沿身前自然收回，双肘靠近身体两侧并保持弯曲，双手停在腰部上方、下胸部下方的身体前侧，双掌转为斜向上、手掌托起的姿势朝向镜头。
    收回过程中两只手保持分开，手指放松舒展。双手不相碰，不托下巴，不贴脸，不继续向镜头推出。

    4.3—5秒，歪头等夸：
    双手保持身前斜向上的掌心不动，双手位置不抬高、不高于下胸部；头轻轻向一侧倾斜，眉毛略微抬起，露出自信、俏皮、明显得意的笑容，像刚跳完一小段舞，正在等镜头前的人夸奖。
    这段同样在全身中景里完成：取景从头到尾保持头顶至大腿中段，不推近、不变成半身特写，人物大小与开头一致。
    全程嘴唇自然闭合，不说话、不对口型。最后保留轻微肩膀回弹和自然呼吸，不突然冻结。

    动作衔接：
    双手从身体前方向两侧展开，接着完成左右交替起伏，再自然收回前侧，形成一条连续的动作路径。
    每段之间不重新准备，不突然换姿势。头发和衣物随动作产生轻微自然的跟随变化。
    整段视频是同一个固定景别的单镜头：取景自始至终保持首帧的头顶至大腿中段构图，画面不推近、不拉远、任何一段都不裁成半身特写，包括收尾的歪头等夸。

    手部与身体：
    手指以自然舒展为主，不临时变成比心、指脸、猫爪或拳头。双手各自在身体一侧运动，不交叉，不从面部中央经过。肩膀放松，手臂关节自然弯曲。

    避免出现：
    手臂快速扑扇、双手举过头顶、双臂完全伸直绷平、双手触到或超出画面边缘、后段一直停在展臂姿势直到结尾仍没有收回到身前、复杂绕腕、手指反复张合、双臂交叉、突然转身、夸张扭腰顶胯、向前鞠躬，以及人物外观、服装或背景发生变化。
  frame_from: 首帧图
  frame_slot: first_frame
