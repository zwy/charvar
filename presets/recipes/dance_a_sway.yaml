steps:
- kind: adhoc_image
  label: 首帧图
  prompt: |
    以<image1>中的人物为唯一主体，生成一张用于后续舞蹈视频首帧的单人竖版图片。

    人物身份：
    保留<image1>中人物的五官特征、脸型、发型、发色、肤色与个人辨识度，保留原有体型，不改变人物的性别表达，不将人物替换成统一的网红脸。保持原图的整体视觉类型，真人照片保持自然真实的摄影质感，绘画角色保持原有绘画风格。

    人物服装：
    沿用<image1>中人物的服装，保持可见的款式、颜色、领口、袖型和图案。原图未展示的衣服下半部分自然延续已有设计，不额外添加夸张配饰。人物双手不持物。

    构图与镜头：
    9:16竖版，正面平视，单人居中，画面完整展示头顶至大腿中段。头顶留出少量空间，双肩、双肘和双手完整入镜，身体两侧留出屈肘摆臂的活动空间。人物面向镜头，肩线基本水平，躯干正对前方，不侧身，不采用俯拍、仰拍或广角畸变。

    起始姿态：
    人物自然站立，双腿略微分开，双膝轻微放松，身体重心位于中间，上身直立但不僵硬。双臂自然屈肘，肘部靠近身体两侧但不夹紧；双手松握拳，分别停在腰部上方、下胸部下方的位置，两拳之间留有间隔，手腕平直。双肩放松，不耸肩，不抬高手臂，不让手部遮挡面部。整体是即将开始轻快摇摆舞的准备姿势。

    表情与视线：
    看向镜头，嘴角带轻松、俏皮的浅笑，表情自然，不张大嘴，不刻意挤眼。

    背景与光线：
    明亮简洁的室内背景，浅色墙面，画面干净，没有其他人物、镜面反射或杂乱物品。柔和均匀的正面光线，人物面部、手臂与服装清楚可见。

    最终画面：
    只出现一名人物，人体比例自然，双臂和双手结构清楚，服装轮廓完整。没有文字、水印、拼图或动作残影。
  backend: comfyui
  aspect: "9:16"
  reference_labels: [front]

- kind: video_model
  label: 直出片段
  prompt: |
    以输入首帧为唯一视觉依据，生成一段约5秒的单人轻快摇摆舞视频。

    画面连续性：
    从输入首帧的姿态直接开始。保持首帧中人物的身份、五官、发型、体型、服装、背景、光线与整体画风一致。全程只有同一名人物，服装款式、颜色和图案保持连续。

    镜头：
    9:16竖版，正面平视固定镜头，一镜到底。维持首帧中头顶至大腿中段的构图和人物大小，不推拉、不摇移、不切镜头。人物始终位于画面中央附近，双肘和双手保持在画面内。

    舞蹈整体：
    人物面向镜头，完成一小段轻快、俏皮、有弹性的摇摆卡点舞。以膝盖轻弹、重心左右移动、肩膀随动和屈肘摆臂形成节奏。动作幅度适中，重心始终留在原地附近，不走动，不跳跃，不转身。脸部大部分时间朝向镜头。

    动作顺序：

    0—0.6秒，轻弹起势：
    从首帧的屈肘松握拳姿态开始，双膝轻轻屈伸一次，身体随之小幅下沉再回弹，双手保持在腰部上方，顺势进入舞蹈，不停顿等待。

    0.6—1.8秒，左右弹摆：
    身体重心先向画面左侧轻移，再向画面右侧轻移。肩膀和胸口自然跟随，双肘保持弯曲，两只松握的拳头随身体做小幅左右摆动。头部轻轻随动，视线仍看向镜头。

    1.8—3.2秒，高低换拳：
    身体回到中央，双拳移到胸前，两拳之间保持间隔。一只拳头略高、另一只拳头略低，随后两拳交换高低位置，形成一组清晰、短促的上下错位动作。双肘始终弯曲，拳头不超过下巴，不遮挡面部，身体继续轻微弹动。

    3.2—4.4秒，双拳侧摆：
    双拳回到相近高度，一起摆向画面左侧，再一起摆向画面右侧，移动范围保持在胸廓前方和两侧附近。双拳不相碰，双臂不交叉。肩膀和上身轻轻跟随摆动，脸仍朝向镜头，动作轻松连贯。

    4.4—5秒，俏皮亮相：
    身体回正，双拳顺势抬到肩膀前侧附近，与脸部保持距离。头轻轻向一侧倾斜，嘴角扬起，露出自然俏皮的笑容。身体保留轻微回弹，让视频在动作余韵中结束，而不是突然僵住。

    动作衔接：
    所有动作连续完成，前一个动作自然带出后一个动作，不在每段之间停下来重新摆姿势。头发和衣物随身体运动产生轻微、自然的跟随变化。双手始终松握拳，不临时变成比心、指人或复杂手指动作。

    避免出现：
    大幅甩头、转身背对镜头、深蹲、跳跃、夸张扭腰顶胯、手臂快速穿过面部、双手交叉纠缠、突然新增动作，以及人物外观或背景发生变化。
  frame_from: 首帧图
  frame_slot: first_frame
  model: heygen/heygen-video-1
  duration: 5
  resolution: 480p
  aspect: "9:16"
  wait_s: 420
