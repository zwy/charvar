- kind: adhoc_image
  label: 首帧图
  prompt: |
    以<image1>中的人物为唯一主体，生成一张用于后续秧歌舞蹈视频首帧的单人全身竖版图片。

    人物身份与画风：
    保留<image1>中人物的五官特征、脸型、发型、发色、肤色、原有体型与个人辨识度，不替换成明星脸或统一的网红脸，不改变人物的性别表达。
    保持原图的真人摄影质感：真实自然的摄影光影，保留细微皮肤纹理与真实发丝，服装面料的光泽与织纹清楚，修饰克制。
    不要变成插画、动漫或 3D 渲染，不要改成卡通或平涂风格。
    保留<image1>中人物腿上的裸肤色薄透连脚丝袜，丝袜完整、连续、贴服双腿，不消失，不变成网袜、花纹袜或过膝袜。

    人物服装：
    沿用<image1>中人物的服装，保持可见的款式、颜色、领口、袖型和图案：白色缎面连衣裙，方领配一圈白色荷叶边抽褶领，双层荷叶边飞袖，肩部荷叶边外缘有一道深藏青色细条纹滚边，胸前正中系一只浅黄色缎带大蝴蝶结、结心是一颗绿色圆珠，腰部收紧，裙身自腰部起是细密纵向抽褶并向外蓬起成 A 字，裙长到大腿中段偏下，裙摆由两层白色荷叶边叠成、藏青滚边夹在两层荷叶边之间。
    保留裸肤色薄透连脚丝袜与裸杏色厚底高跟露趾鞋，丝袜表面那条连续高光带和缎面的光泽自然延续。
    不添加其他配饰，不换成短裙、裤装或其他颜色，不改变裙子款式。人物双手不持物。

    构图与镜头：
    9:16竖版，正面平视，单人居中，全身完整入镜，从头顶到鞋底都清楚可见。头顶和鞋底下方各留出适量空间，人物两侧留出双臂外摆画圆的活动空间，不裁切手指、鞋尖或脚跟。
    人物站在平整地面上，镜头保持正常透视，不俯拍、不仰拍，不使用广角畸变。

    起始姿态：
    人物面向镜头自然站立，双脚左右分开约一个脚掌的间隔，脚尖基本朝向前方，双脚完整接触地面。双膝略微放松，上身直立，身体重心位于中间，不深蹲、不弯腰、不撅臀。

    双臂抬起，准备在身前推动一个大圆环：
    双肘弯曲并离开躯干约一拳距离，前臂从肘部斜向上抬起，手腕位置高于手肘。
    双手像捧着一个看不见的球那样抬起来：手腕抬到胸口正下方、明显在腰带和裙摆上方一带的高度，前臂从肘部向上斜抬，不向下垂放；两手掌心斜向前、指尖斜向上，之间隔着差不多一个球的宽度，不搭在腰带或裙子上。
    两手各自在身体中线的两侧，不要在身前合十、不要两掌相碰。
    整体像两手分别扶着一个看不见的大圆环的两侧、正准备把那个圆环横着推出去。不要把手垂在身侧，不要把手放在髋部或裙子上，不要把手举到脸旁或肩上，不要提前比耶或做猫爪。

    表情与视线：
    人物直视镜头，头部端正，表情轻松含笑、有表演的兴致，嘴唇自然闭合带一点笑意。不皱眉装凶，不做鬼脸，不夸张大笑。

    背景与光线：
    简洁明亮的室内背景，浅色墙面，平整清楚的地面，脚下有自然接触阴影。没有其他人物、镜面反射或杂乱物品。
    柔和均匀的光线，人物全身和双脚清楚可见，裙子的白色缎面质感、胸前蝴蝶结和腿部丝袜清楚可辨。

    最终画面：
    正常人物准备开始跳秧歌的瞬间。人体比例自然，双手结构清楚，裙长与丝袜完整，服装轮廓完整，没有文字、水印、拼图或动作残影。
  backend: comfyui
  aspect: "9:16"
  reference_labels: [front]

- kind: video_model
  label: 直出片段
  prompt: |
    以输入首帧为唯一视觉依据，生成一段约5秒的单人秧歌视频。

    画面连续性：
    从输入首帧的姿态直接开始。保持人物的身份、五官、发型、体型、服装、鞋子、背景、光线和整体画风一致。全程只有同一名人物，不换装，不新增配饰或道具。
    保持首帧的真人摄影质感：真实自然的光影，皮肤、发丝、缎面光泽与丝袜的材质表现保持一致。全程不要变成插画、动漫或 3D 渲染。
    人物腿上的裸肤色薄透连脚丝袜全程完整贴服双腿，不消失、不变成网袜或花纹袜；裙子长度保持在大腿中段偏下，胸前那只浅黄色缎带蝴蝶结全程在位。

    镜头：
    9:16竖版，正面固定镜头，一镜到底。
    保持首帧的全身构图和人物大小，头顶、双手、鞋尖与脚跟始终在画面内，地面保持稳定，不推拉、不摇移、不切镜头，不追随人物移动。

    整体表演：
    人物面向镜头，完成一小段喜庆、舒展的秧歌。
    主要动作是双手在身前横向推动一个看不见的大圆环，像转动一个看不见的呼啦圈：两手始终像扶着环的两侧，两手分开、间距不变，一起向身体的一侧推出一条平缓的横向弧线，停在身体侧前方、离躯干约一掌远的位置，高度在胸口附近，然后并排收回身体正前方。这个圆环是横着的、在身体正前方，不是在头顶上转。
    双手全程保持在胸口附近的高度活动，不往上飘、不举过头顶，动作的重心在身前偏下，不做高举过头的动作。
    身体的重心随弧线小幅移到对应一侧再回到中间，躯干基本保持正面，脸始终朝向镜头。
    脚下的步子是小幅的左右踏步，脚不离地，不走动、不跳跃、不转身。厚底高跟鞋保持稳稳踩在地面，不踮脚、不脱脚。

    动作顺序：

    0—1.2秒，起势：
    从首帧托举的姿态直接开始，双膝轻轻屈伸一次，身体小幅下沉再回弹。
    双手同时从身体正前方开始向身体的一侧横向推出，前臂从肘部向上带出，划到身体侧前方胸口附近的高度。
    双手始终分开、不相碰、不交叉、不在身前合十。身体重心随之小幅移到那一侧，肩膀和胸口自然跟随，脸始终朝向镜头。

    1.2—2.6秒，第一个完整推收：
    双手从身体侧前方沿一条平缓的横向弧线推回到身体正前方胸前的高度，完成一次完整的「推出—收回」。
    推和收的过程中两手间距始终不变、一起动，不是单手伸出、不是两手轮流。收回时身体重心回到中间，再小幅移到另一侧。
    整段推收双手始终不超过锁骨高度，不抬高到脸旁，不举到肩上，双手不越过身体两侧的轮廓，不向镜头推近。
    头发、裙摆和衣物随身体运动产生轻微自然的跟随变化。

    2.6—4.0秒，第二个完整推收：
    用同样的方式向另一侧再完成一次完整的「推出—收回」，动作连贯不中断，节奏比第一个略快、幅度相当。
    膝部继续轻弹，重心左右小幅移动，双脚只在原地做小幅度踏步，不向前走远，不滑行。

    4.0—5秒，收尾亮相：
    双手必须在4.0秒前回到身体正前方胸口正下方的高度并停住，两手分开约两个拳头的宽度，掌心斜向前，保持扶住圆环两侧的姿势不再继续推动。
    身体回正，重心回到中间，双膝再轻轻弹动一下。
    4.2—5秒保持这个亮相，只轻轻点头一次，肩膀保留少量节奏回弹，嘴角浮现自然、喜庆的笑意，看向镜头，在舒展的亮相状态中结束，不突然冻结，不额外追加动作。

    动作衔接：
    两个推收连续完成，前一个自然带出后一个，不在每段之间停下来重新摆姿势。整段双臂只做横向推收这一个动作，不临时变成比心、指人、猫爪或握拳。

    表情与手部：
    全程轻松、有表演的兴致，不装凶、不夸张卖萌。嘴唇自然，不说话，不对口型。
    双手保持自然舒展，手指略微并拢，不反复变成拳头或复杂手势。

    避免出现：
    变成插画或 3D 渲染、丝袜消失、丝袜变成网袜或花纹袜、裙子变短、裙面变透明走光、裙摆被掀起、胸前蝴蝶结消失、鞋变形或脱脚、人物外观变化、走动、跳跃、转圈、甩头、深蹲、双手同时离地、脚底滑行、双臂交叉、双手在身前合十、双手穿到脸部、手臂大幅张开成展示位、双手举过肩膀、双手举过头顶、双手在脸旁上下挥动、躯干大幅扭转、夸张扭腰顶胯、背景或光线变化，以及画面里出现第二个人。
  frame_from: 首帧图
  frame_slot: first_frame
  model: heygen/heygen-video-1
  duration: 5
  resolution: 480p
  aspect: "9:16"
  wait_s: 420
