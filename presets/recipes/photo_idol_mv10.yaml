- kind: video_model
  label: 成片
  manual: true
  prompt: "以素材1为首帧，生成10秒、16:9横屏、四镜头的日式偶像打歌MV。主角全程为素材1中的同一个人，保持五官比例、脸型、肤色、妆容、刘海、分缝、发色及可见发束轮廓一致。舞台造型仅改变服装，不重新设计脸和发型，头发只随动作自然摆动。\n\
    \ncinematic live-action，真人实拍电影感画质；high-key bright lighting，高调明亮打光（画面明亮通透、阴影浅、对比柔和，色彩清透粉嫩）；全片同一调色与光线风格，任何镜头不变暗、不变灰、不换画风。动作轻快、有力度、自然连贯，不以倍速或抽搐表现活力。\n\
    \n【服装与舞台】\n主角身穿珍珠白舞台上衣、樱粉色短外套、胸前缎带蝴蝶结、银边粉白百褶短裙与白色短靴，领口完整、不露腰，全片服装一致。8名成年伴舞面容各异，不复制主角，身穿白色为主、浅粉点缀的简化款打歌服，装饰少于主角。\n\
    \n延续首帧中的粉蓝金色华丽打歌舞台：对称灯阵、水晶装饰、层叠拱形灯框、中央背景屏与柔和反光地面。正面柔光始终照亮主角面部，背景灯光随节奏变化，不频闪、不遮脸。群舞镜头中，主角始终位于中央前景，伴舞位于两侧后方，不遮挡、不顶替主角。\n\
    \n【镜头一｜0–2秒：贴脸对视】\n从素材1直接接续，固定极近面部特写，允许裁去部分额头或下巴，双眼、鼻子与嘴巴完整清晰，脖子、肩膀及任何衣服均不入画。主角直视镜头，嘴角逐渐展开成明亮微笑。一道暖金色光带在约1秒内从画面一侧平滑横扫整张脸，单次扫完，不频闪、不往复；扫过处眼瞳亮起高光、脸颊提亮、发丝边缘泛起金色光泽，随后回到柔和定妆光。微笑到高点时随强拍切镜，不提前拉远。本镜无文字。\n\
    \n【镜头二｜2–4秒：READY，登场即起舞】\n硬切正面膝上中景，主角已位于中央前景，面部清楚，延续上一镜同一张脸、同一发型。8名伴舞左右各4名，分布在两侧后方。镜头固定，主角不从远处人群中走近。\n\
    \n切镜强拍处，背景屏上方亮起超大圆角粗体大写“READY”，珍珠白字面、樱粉色厚边，整词轻弹到位后稳定显示，不遮挡头部。\n\n主角向前迈一小步并打开双臂，伴舞同步向两侧后方开步，形成以主角为最前端的宽V字。开臂后立即接左右交替踏步，双肘在肩线下方打开、收回，膝盖随拍轻弹。全员连续律动，不停下来摆姿势。主角保持正脸朝镜头，手臂避开面部。\n\
    \n【镜头三｜4–7秒：全员齐舞，动作爆发】\n切稍宽的正面中远景，以展示主角全身为限，不切远距离大全景。READY熄灭。主角仍在中央前景，8名伴舞保持两侧后方的宽V字。镜头固定，不横移、不环绕。\n\
    \n9人连续齐舞：向左侧跨步并向左斜上出臂，随即向右侧跨步并向右斜上出臂；接一次轻快小跳，双臂向高V字展开，落地屈膝回弹，继续踏步接下一镜。伴舞同步呼应，动作整齐有力度，不站着等待、不交叉换位。主角头部相对稳定，不甩头、不转身，手臂不经过脸前。本镜无文字。\n\
    \n【镜头四｜7–10秒：SHINE，最后一拍亮相】\n切正面膝上中景，主角留在原位，不向镜头走近。全员延续踏步律动，双臂随强拍向斜上方展开。\n\n约7.5秒，背景屏上方出现超大圆角粗体大写“SHINE”，与READY使用同一字体、尺寸略大，粉色细闪字面、珍珠白亮边。整词快速放大到位，边缘掠过一次光泽后稳定显示至结束，不遮挡主角面部。\n\
    \n文字出现后，全员继续左右踏步与肩侧摆臂；约9秒最后重拍，主角落稳，双臂舒展打开后收至腰侧，轻轻歪头，直视镜头灿烂微笑。伴舞同时在两侧后方微屈膝、展开手臂，以对称低位造型衬托主角。镜头仅小幅推进至腰部以上，最后一秒保留呼吸、发丝与裙摆余摆，不完全冻结，不切黑、不变暗。\n\
    \n【音乐与声音】\n明亮轻快、富有弹跳感的J-pop电子流行器乐，清亮合成器、弹跳贝斯、拍手与电子鼓推动节奏。2秒切镜进入主律动，4秒齐舞加强鼓点，约7.5秒SHINE配合开臂重音，约9秒统一收势，最后留短促明亮尾音。音乐为主，轻微保留舞鞋落地与衣料摆动声，无对白，不突出喘息。\n\
    \n【统一约束】\n主角身份、发型、服装和舞台跨镜头保持一致，四肢与手指结构自然连贯，人物不相互穿插。两处英文准确拼写，固定显示在舞台背景屏上，不作为前景悬浮字幕，不逐字飞入、不持续跳动。除“READY”“SHINE”外，无其他文字、字幕、Logo或水印。"
