  prompt: "以素材1中的人物为唯一身份参考，生成16:9横屏打歌MV首帧。保持本人五官、脸型、肤色及发型发色，不换脸、不重塑五官。\n\n极近距离面部特写，脸部充满画面，允许裁去部分额头或下巴，双眼、鼻子与嘴巴完整清晰。画面仅包含面部与局部发丝，脖子、肩膀、锁骨及任何衣服、领口、肩带均不得入画，不为展示背景而拉远镜头。\n\
    \n日式idol舞台妆：轻薄透亮底妆、自然棕色眼线、根根分明的睫毛、细腻珠光眼影、柔粉腮红与水润粉色唇妆；妆容精致清甜，保留本人辨识度。直视镜头，嘴角轻扬。\n\n背景固定为华丽的粉蓝金色打歌舞台：对称灯阵、水晶装饰与层叠拱形灯框，在脸部边缘虚化呈现，不出现其他人。\n\
    \ncinematic live-action，真人实拍电影感画质；high-key bright lighting，高调明亮柔光，保留自然皮肤与发丝细节，色彩清透粉嫩，不泛白、不过度磨皮。无文字、Logo、水印。"
