- kind: adhoc_image
  label: 首帧图
  prompt: |
    以<image1>中的人物为唯一主体，生成一张用于后续互动手势舞视频首帧的单人竖版图片。

    人物身份与画风：
    保留<image1>中人物的五官特征、脸型、发型、发色、肤色、原有体型与个人辨识度，不替换成统一的网红脸，不改变人物的性别表达。真人照片保持自然真实的摄影质感，绘画角色保持原有绘画风格。

    人物服装：
    沿用<image1>中人物原有的服装，保持可见的款式、颜色、领口、袖型与图案。双手不持物，不额外添加头饰、手套或其他配饰。

    构图与镜头：
    9:16竖版，正面平视，单人居中，完整展示头顶至腰部。头顶留出少量空间，人物两侧留出抬手和摆手的空间，双肘与双手均在画面内。人物躯干正对镜头，不侧身，不俯拍、不仰拍，不使用广角畸变。

    起始姿态：
    人物自然站立，上身直立而放松，双肩基本水平。

    画面右侧的手臂屈肘抬起，手掌停在同侧肩膀外上方、略低于眼睛的位置，与脸部轮廓保持清楚间隔。手掌朝向镜头，五指自然伸展并略微分开，手腕平直，呈现即将向镜头招手的姿态。手掌与脸部处在相近的前后距离，不向镜头伸出。

    另一只手臂自然屈肘，手部放在腰部上方、身体前侧，手指放松，不交叉，不遮挡衣服主要区域。

    表情与视线：
    人物直视镜头，头部基本端正，嘴角带自然浅笑，眼神专注而友好，像刚刚注意到镜头前熟悉的人。不要提前做夸张大笑、挤眼或张嘴表情，为后续视频留出变化。

    背景与光线：
    明亮简洁的室内背景，浅色墙面，没有其他人物、镜面反射或杂乱物品。柔和均匀的正面光线，脸部与双手清晰可见。

    最终画面：
    像人物正准备向镜头打招呼的瞬间。保持人物比例自然、手部结构清楚、服装细节完整，没有文字、水印、拼图或动作残影。
  backend: comfyui
  aspect: "9:16"
  reference_labels: [front]

- kind: video_model
  label: 直出片段
  prompt: |
    以输入首帧为唯一视觉依据，生成一段约5秒的单人俏皮互动手势舞视频。

    画面连续性：
    从输入首帧的姿态直接开始。保持人物的身份、五官、发型、体型、服装、背景、光线与整体画风一致。全程只有同一名人物，不新增配饰或道具。

    镜头：
    9:16竖版，正面平视固定镜头，一镜到底。保持首帧中头顶至腰部的构图与人物大小，不推拉、不摇移、不切镜头。双手与双肘保持在画面内。

    整体表演：
    人物像正在对镜头前熟悉的人进行一次俏皮、开心的舞蹈互动。动作轻快，表情有递进，身体有小幅弹性律动。不是僵硬摆拍，也不是夸张卖萌。

    全程看向镜头，头部只做小幅倾斜，不转成侧脸。肩膀自然放松，躯干保持正面，不走动、不跳跃、不转身。

    动作顺序：

    0—1.4秒，看到你，开心招手：
    首帧中已经抬起的那只手保持在肩膀旁，手掌朝向镜头，以手腕为中心小幅左右招手两下，不大幅挥动整条手臂。
    另一只手保持在腰部上方。人物的浅笑逐渐变得明亮，身体随招手轻轻弹动，像看到熟悉的人后主动打招呼。不要先放下手再重新抬起。

    1.4—3.2秒，指向脸颊，俏皮展示：
    招手的手自然收近，另一只手同时从腰部上方抬起。双手分别伸出食指，其余手指自然弯曲。
    两根食指分别停在两侧脸颊外侧，指尖朝向各自一侧的脸颊，与皮肤保持少量距离，不接触、不戳压。双手不经过面部中央，不遮住眼睛、鼻子和嘴。

    保持这个指脸姿态，头先向画面左侧轻轻倾斜，再向画面右侧轻轻倾斜。双手随肩膀自然配合，不追着脸来回戳动。人物看向镜头，笑容带一点"看我看我"的俏皮感。

    3.2—5秒，双手开花，开心回应：
    双手从指脸姿态自然展开，五指舒展，变成两只朝向镜头的手掌，分别停在两侧脸颊外侧。
    双手与脸部轮廓之间保持清楚间隔，不贴脸，不放到下巴下面，不互相接触。
    两只手掌在各自一侧轻轻左右摆动，肩膀配合轻微弹动，笑容自然加深。最后头部轻轻向一侧倾斜，在开心、俏皮的互动状态中结束，保留自然余动，不突然冻结。

    动作衔接：
    招手自然过渡到双手指脸，再自然展开成双手摆掌。动作连续完成，不在段落之间停下来重新准备。手部主要在肩膀与脸颊外侧活动，不伸向镜头。头发与衣物随动作产生轻微自然的跟随变化。

    表情：
    从友好的浅笑，过渡到俏皮的笑，再变成开心明亮的笑容。保持人物原有面部特征，不夸张张嘴，不挤眼，不吐舌，不生成说话口型。

    避免出现：
    双手遮挡面部、指尖接触眼睛、手掌贴脸、手臂交叉、手部快速伸向镜头、大幅甩头、身体前后探动、突然新增比心或飞吻动作，以及人物外观、服装或背景发生变化。
  frame_from: 首帧图
  frame_slot: first_frame
