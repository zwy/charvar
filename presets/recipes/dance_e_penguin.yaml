- kind: adhoc_image
  label: 首帧图
  prompt: |
    以<image1>中的人物为唯一主体，生成一张用于后续企鹅拟态舞蹈视频首帧的单人全身竖版图片。

    人物身份与画风：
    保留<image1>中人物的五官特征、脸型、发型、发色、肤色、原有体型与个人辨识度，不替换成统一的网红脸，不改变人物的性别表达，不夸张改变头身比例，不通过增胖、缩短四肢或改变面部制造搞笑效果。
    真人照片保持自然真实的摄影质感，绘画角色保持原有绘画风格。

    人物服装：
    沿用<image1>中人物可见的服装，保持款式、颜色、领口、袖型和图案。原图没有展示的下装自然补全为与现有服装协调的日常下装，双脚穿简洁的平底浅口单鞋，鞋跟低平。
    不擅自换成黑白配色，不添加企鹅服、动物头套、翅膀、喙或其他动物装饰。人物双手不持物。

    构图与镜头：
    9:16竖版，正面平视，单人居中，全身完整入镜，从头顶到鞋底均清楚可见。头顶和鞋底下方留出适量空间，人物两侧留出小步侧移和前臂外摆的空间，不裁切手指、鞋尖或脚跟。
    人物站在平整地面上，镜头保持正常透视，不俯拍、不仰拍，不使用广角畸变。

    起始姿态：
    人物面向镜头，自然站立，双脚左右分开约一个脚掌的间隔，脚尖基本朝向前方，双脚完整接触地面。双膝略微放松，上身直立，身体重心位于中间，不深蹲、不弯腰、不撅臀。

    双臂自然垂放在身体两侧：双上臂轻贴躯干侧面，从正面看上臂轮廓与身体轮廓几乎重合；双肘微弯，前臂下端向斜下外侧小角度张开，双臂与躯干的夹角小于20度；双手停在髋部外侧、位置略低于腰部，不碰到裙摆。
    双手自然舒展，手指略微并拢，指尖斜向下，手掌侧面朝向镜头。这是企鹅收拢的小短翅姿态：整条手臂收在身体轮廓附近，从正面看双臂加起来的左右跨度不超过肩宽。不要把双臂向两侧张开，双手不要飘到裙摆以外，不抬高手臂，不做猫爪或握拳姿态。

    表情与视线：
    人物直视镜头，头部端正，表情认真、平静，嘴唇自然闭合，像已经准备好严肃地表演一支舞。不要皱眉生气，不做鬼脸，不提前大笑。

    背景与光线：
    简洁明亮的室内背景，浅色墙面，平整清楚的地面，脚下有自然接触阴影。没有其他人物、镜面反射或杂乱物品。
    柔和均匀的光线，人物全身和双脚清楚可见。

    最终画面：
    正常人物认真准备跳企鹅拟态舞的瞬间。保持人体比例、服装结构和双手双脚自然，没有文字、水印、拼图或动作残影。
  backend: comfyui
  aspect: "9:16"
  reference_labels: [front]

- kind: video_model
  label: 直出片段
  prompt: |
    以输入首帧为唯一视觉依据，生成一段约5秒的单人企鹅拟态舞蹈视频。

    画面连续性：
    从输入首帧的姿态直接开始。保持人物的身份、五官、发型、体型、服装、鞋子、背景、光线和整体画风一致。
    人物始终保持原本人类外观，不变成企鹅，不新增动物装饰，不改变身材比例。全程只有同一名人物。

    镜头：
    9:16竖版，正面固定镜头，一镜到底。
    保持首帧的全身构图和人物大小，头顶、双手、鞋尖与脚跟始终在画面内。地面保持稳定，不推拉、不摇移、不切镜头，不追随人物移动。

    整体表演：
    人物以认真、淡定的表情完成一小段轻快的企鹅拟态舞。
    搞笑感来自低位外张的双臂、小幅左右摇摆和短促的侧点脚步，不通过鬼脸、身体变形或摔倒制造笑点。

    躯干始终朝向镜头，头部大致保持正面。上身保持直立，双膝柔和放松，不深蹲、不弯腰、不撅臀，不夸张扭腰顶胯。

    动作顺序：

    0—0.6秒，认真起势：
    从首帧姿态开始，双膝轻轻屈伸一次，身体小幅下沉再回弹。
    双上臂保持靠近躯干，前臂顺势向外轻轻张开一点，再回到低位外张的基本姿态。双手保持在髋部两侧附近，不抬到胸前。
    人物保持认真表情，直接进入节奏，不先垂手再重新准备。

    0.6—2.2秒，左侧点步：
    画面左侧的脚整只小幅抬起约一只脚踝的高度，向左侧挪出约半个脚掌的距离，用前脚掌轻轻点一下地面，不踢腿，不向前伸腿，脚尖始终大致朝向镜头方向。
    身体和头部随之向画面左侧小幅倾移，另一只脚留在原地支撑。双肩保持放松，身体像小企鹅一样轻轻侧摆。
    随后这只脚放平收回到起始位置，身体回到中央。整段只有这一次抬起与收回，脚不向后抬起、不绷脚尖、不做芭蕾动作。
    双臂配合身体轻轻摆动，上臂保持贴近躯干，双手始终在腰部以下，双臂保持低位外张的企鹅翅膀轮廓。

    2.2—3.8秒，右侧点步：
    换成画面右侧的脚整只小幅抬起约一只脚踝的高度，向右侧挪出约半个脚掌的距离，用前脚掌轻轻点一下地面。
    身体和头部随之向画面右侧小幅倾移，另一只脚留在原地支撑。
    随后这只脚放平收回到起始位置，身体回到中央。
    动作与前一侧形成左右对应的摇摆节奏，两脚始终不交叉、不叠放，脚不向后抬起、不绷脚尖做芭蕾动作，不连续向一侧走远，不滑行。

    3.8—5秒，淡定收尾：
    双脚必须在4.3秒前回到起始站位并放平，双膝再轻轻弹动一下。
    双上臂仍靠近身体。
    4.3—4.7秒，左右前臂同时向外短促轻摆一下再收回，像小企鹅扇了一下小小的翅膀：摆动幅度小、只发生一次、干脆利落，摆完立即回到低位外张的基本姿态，双手不抬过腰部。
    人物头部轻轻向一侧倾斜，仍看向镜头，嘴角最后只浮现一点不明显的笑意，像认真跳完后在等评价。
    保留自然呼吸和轻微身体余动，不突然冻结，不鞠躬。

    运动要求：
    整段动作保持在原地附近，左右两次点步的距离都较短。每次点步都有清楚的抬脚、点地和收回过程，不让鞋底沿地面滑行。
    身体的左右移动来自脚步和重心变化，不让头部、躯干和双腿彼此脱节。
    手臂摆幅小于身体两侧预留空间，双手不经过身体前方，不碰撞大腿。除收尾段的一次短促小扇翅外，双臂全程保持低位、贴身、小幅外张的企鹅翅膀轮廓，不大幅扑扇。

    表情与手部：
    大部分时间保持认真、淡定，最后才出现少量笑意。不张嘴对口型，不挤眼，不吐舌，不做夸张鬼脸。
    双手保持自然舒展，手指略微并拢，不反复变成拳头、猫爪或比心。

    避免出现：
    变成企鹅、身体增胖或缩短、腿向后上方抬起、绷脚尖、芭蕾舞姿、双腿交叉、快速碎步、双脚同时离地、蹲跳、转圈、摔倒、鞋底滑行、双臂向两侧张开成展示位、手臂大幅扑扇，以及人物外观、服装、鞋子或背景发生变化。
  frame_from: 首帧图
  frame_slot: first_frame
  model: heygen/heygen-video-1
