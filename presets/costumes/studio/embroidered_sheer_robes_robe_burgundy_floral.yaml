ref_prompt: 'Flat lay clothing product photography, top-down view, on a pure white
  background: a pale burgundy short sheer fine-mesh wrap robe that ends at the upper
  thigh (halfway between waist and knees), with an open crossover V-neck showing its
  two separate front edges, wide sleeves reaching the wrists with subtly flared cuffs,
  narrow matching binding along the neckline and front edges, and dense dark burgundy
  floral embroidery concentrated at the cuffs and upper-thigh hem. One separate matching
  narrow burgundy tie belt. Lay the robe and belt flat as two separate pieces with
  a clear gap and no overlap. The belt lies separately beside the robe, not tied around
  the flat garment. Necklines toward the top, hems toward the bottom. Preserve realistic
  relative sizes and show all edges with margins. Sheer mesh remains translucent against
  the white surface while the embroidery is denser. Soft diffused studio lighting
  from the upper left, faint contact shadows. No people, no mannequin, no hangers,
  no shoes, no accessories beyond the listed belt, no text.'
