prompt_text: 服装：该成年角色身穿浅酒红半透明细网纱短罩袍，衣长至大腿中段，交叠V领、宽长袖、微喇叭袖口；同色细腰带在腰前系结并垂下。深酒红花卉刺绣集中于袖口和下摆，领缘及前襟有细窄包边。罩袍为唯一衣物，赤脚，无袜、帽子、手套、首饰或手包。
