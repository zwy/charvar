# 新版 Q21 数据集构建工作流（根目录 characterDataset_q21Chardatasetbuilder_v2.json）
# 的 30 条变体提示词，逐字提取自 Prompt 子图 Four Images 文本（剥 [BODY_NOTES] 等
# Customize 微调占位符（原文件里默认为空）与无效的 [BACKGROUND]/[LIGHTING] 注入点）。
# 结构变化：chest 组 l135/r135 → high/low 机位；head 组 6 机位；表情 8 张。
name: q21_v2_30
type: list
version: 1
master_template: '{style_lock_sentence}{identity_lock_sentence}{outfit_lock_sentence}{extra}'
suffix_template: The background is {background}. The lighting is {lighting}.
backgrounds_ref: wildcards/backgrounds_v2.yaml
lighting_ref: wildcards/lighting_v2.yaml
caption_background_suffix: false
# 参考图顺序与原工作流一致：<image1>=Headshot（脸/发型/头饰）、<image2>=Front（服装/身体）、
# <image3>=Side（朝向）、<image4>=Behind（背部）——前端按此默认勾选并提示
reference_order: [headshot, front, side, behind]
caption_tags:
  angle:
    high: high-angle view
    low: low-angle view
  expression:
    shocked: shocked expression
    laugh: laughing
variants:
- id: full_front
  text: 'Use the same art style, medium, and rendering as <image1>, <image2>, <image3>, and <image4>. Create a new straight-on full-body front view of the character in <image2>. Use <image2> for the outfit and body only; its body angle and stance are replaced. Copy the face, hair, and headwear exactly as they appear in <image1>, and the body shape, proportions, complete outfit, and footwear exactly as they appear in <image2>, including their colors, materials, and details. Use <image1> only for the face, not its crop or close-up framing. The camera is at chest height, directly in front of the character, straight on, far enough back to fit the entire figure. The whole body faces the camera squarely: both feet point straight toward the camera, shoulder-width apart, with the toes of both shoes equally visible; the hips and shoulders are level and equally wide on both sides of the body; the center line of the outfit runs straight down the middle of the figure; both arms hang relaxed at the sides and are equally visible; the head is straight and level, the face symmetrical with the nose on the center line and both eyes, both cheeks, and both sides of the jaw equally visible, and any headwear level and symmetrical. The eyes look straight into the camera, with the face at rest: the eyebrows level in their natural position, the lips closed and resting together, and the jaw relaxed. The character stands upright and still in a neutral pose, with weight on both feet, feet shoulder-width apart, legs straight, and arms relaxed at the sides. The whole body is visible from the top of the head to the soles of the shoes, centered, with a small margin above the head and below the feet, and the camera is far enough back to fit the entire figure. Take only the character''s identity from <image1>, <image2>, <image3>, and <image4> and create a new pose, camera angle, background, and lighting. One character only, no text.'
