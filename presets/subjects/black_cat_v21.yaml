id: black_cat_v21
name: 黑白猫
subject_noun: cat
reference_tag: <image1>
style_lock:
- 采用低眉波普气质的二维水彩混合媒介插画。
- 透明水彩与不透明水粉、丙烯笔触结合，眼睛和口鼻精细，身体以大色块概括，肩背和胸腹局部有积色水痕、纸面颗粒、干刷与少量白色颜料点，主体轮廓清楚。
identity_lock:
- 带猫狸子血统的原创黑白燕尾服猫。
- 头部略大，头顶较宽，口鼻圆润。
- 修长三角耳竖起，耳内灰粉紫色。
- 巨大灰蓝色杏仁眼，上眼睑稍低垂，下缘圆润，虹膜细腻，深黑瞳孔带少量白色高光。
- 珊瑚红倒三角鼻头，小巧猫嘴，细长白胡须向两侧舒展。
- 头顶、耳朵、眼周与脸部外侧黑色。额头中央狭长白毛沿鼻梁展开，连接白色口鼻、下巴及胸腹。
- 颈部明显修长，肩部较窄，胸腹纵向拉长，身体纤细优雅，具有自然猫科结构。
- 四肢细长，脚爪小巧，尾巴细长、黑色，连接自然。
- 黑毛以近黑、深蓝灰、炭灰构成，内部有渗化、积色和颗粒。白毛以不透明白色笔触叠加浅冷灰蓝阴影，毛束简洁。
outfit_lock:
- 四肢上部黑色，四只脚爪全部白色，包含两只前爪和两只后爪。
- 白色完整覆盖每只脚爪的脚趾与爪背，延伸至脚踝，形成四只短白袜，分界自然清楚。
- 后爪按姿态显露或遮挡，露出部分同样白色，仅用浅冷灰蓝阴影表现体积。
extra: 任意姿态与场景中，保持同一只黑白燕尾服猫的头部比例、三角耳形、灰蓝色杏仁眼与黑白毛色分区一致，身份特征不随镜头或环境改变。
