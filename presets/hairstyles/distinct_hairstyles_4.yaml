name: distinct_hairstyles_4
type: hairstyle
version: 1
description: 强区分发型四款：精灵短发、及腰长直发、高马尾、双麻花辫；中文描述，继承原发色，仅替换发型结构，待出图验证。
items:
- id: pixie_cut
  label: 精灵短发（露耳露后颈）
  text: 发型：继承角色原有发色，改为精灵短发，两侧发尾止于耳朵上缘附近，双耳轮廓露出；后脑头发贴合头形，后颈清楚露出；头顶保留少量蓬松层次，短碎刘海，不剃成寸头，不保留垂至肩膀的长发束。
- id: waist_length_straight
  label: 及腰长直发（中分无刘海）
  text: 发型：继承角色原有发色，改为中分及腰长直发，额头露出，无刘海；头发连续垂至腰部，发尾大致齐整，整体顺直；部分长发自然垂在双肩前，其余垂于背后，不做波浪、外翻短层次或卷发，不扎起。
- id: high_ponytail
  label: 高马尾（单束高扎）
  text: 发型：继承角色原有发色，全部头发向后梳拢，在头顶后方以接近原发色的简单发圈固定为一个高扎点，仅一束直马尾，发尾至肩胛骨下方；额头露出，无刘海，无大面积披散长发，不做低马尾、双马尾或半扎发，不加蝴蝶结。
- id: twin_braids
  label: 双麻花辫（左右各一条）
  text: 发型：继承角色原有发色，中分、额头露出，无刘海；头发分成左右两部分，从两侧耳后附近分别编成一条麻花辫，恰好两条，交织纹理清楚，均自然垂在胸前，长度至胸部下缘附近；辫尾用接近原发色的简单发圈固定，不做未编织的双马尾。
caption_tags:
