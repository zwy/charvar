# charvar 瑜伽动作预设｜基础九式 V1
# 沿用现有 type:list 格式，不依赖表情包 schema 2，不需要新增开发。
# 动作内容只管理肢体、支撑接触、朝向、机位与完整入镜；不指定服装、体型、画风或场景。
# master_template 只使用项目现有主体档案字段；如档案锁定了站姿或手臂下垂，请先解除动作冲突。
# 保持无字动作库：本预设不提出图中文字要求，也不使用 display_text。
# 参考图推荐 front 一张；经典模板的 reference_tag 与真实工作流标签保持一致。
# backgrounds_ref / lighting_ref 继续使用现有 V2 文件，不新建 wildcard 文件。
# 可在界面固定背景、光照以减少首轮测试变量；这里不把环境写进动作段落。
# 推荐先用 classic：旧 LLM 改写可能附加全身平视规范，削弱俯卧/跪姿/向下看等动作要求。
# framing=full 用于避免头肩裁切 guard；angle=null 是刻意保留，由各条 text 定义观察方向。
# 不把 camera angle 与动作本身混为一谈；不可把 null 自动回填为 front。
# 为适配横向展开，本预设声明 preferred_aspect_ratio: '4:3'：智能画幅按此出图，
# 不再按 full 落到 2:3 竖版（横向动作有裁切风险）；UI 手动选的比例仍然优先。
# 注意画幅值必须加引号——YAML 会把未加引号的 4:3 读成 sexagesimal 数字。
# 每条用 pose 字段标体式（独立于 expression 表情语义），caption 按 caption_tags.pose 写体式名。
# tags 的最后一项为动作标识，不是表情标签。
# 本文件为动作生成提案，尚未出图验证；不是瑜伽跟练或医疗指导。
# 动作版本：
# 1. yoga_tree: 树式｜脚贴小腿、胸前合掌
# 2. yoga_warrior_ii: 战士二式｜右腿在前、双臂平伸
# 3. yoga_triangle: 三角式｜右腿侧倾、双腿伸展
# 4. yoga_low_lunge: 低弓步新月式｜左膝落地、双臂上举
# 5. yoga_warrior_iii: 战士三式｜左腿承重、右腿后伸
# 6. yoga_dancer: 舞王式｜左腿承重、右手握右脚踝
# 7. yoga_half_moon: 半月式｜左脚与左手支撑、右腿抬起
# 8. yoga_camel: 骆驼式｜双膝跪地、双手扶髋、脊柱明显后弯
# 9. yoga_bow: 弓式｜俯卧、双手各握同侧脚踝、胸髋抬离地面成弓形

name: yoga_basic_9
type: list
version: 1
master_template: 'Create an image of the {subject_noun} from {reference_tag}. {style_lock_sentence}{identity_lock_sentence}{outfit_lock_sentence}{extra} One character only, no duplicated or repeated figure, no multi-view panel, no character sheet layout, no split screen.'
suffix_template: The background is {background}. The lighting is {lighting}.
backgrounds_ref: wildcards/backgrounds_v2.yaml
lighting_ref: wildcards/lighting_v2.yaml
caption_background_suffix: false
reference_order:
- front
preferred_aspect_ratio: '4:3'
caption_tags:
  expression: {}
  pose:
    tree: tree pose
    warrior_ii: warrior II pose
    triangle: extended triangle pose
    low_lunge: low crescent lunge pose
    warrior_iii: warrior III pose
    dancer: dancer pose
    half_moon: half moon pose
    camel: camel pose
    bow: bow pose
variants:
- id: yoga_tree
  text: >-
    Perform Tree Pose in a clear full-body front view. Left and right refer to the character's own body. The left
    leg supports the body, with the whole left sole firmly contacting the ground. The standing leg extends naturally
    without locking the knee backward. Bend the right knee and open it toward the character's right side. Place
    the right sole against the inner left calf below the knee, with the right toes pointing downward; do not place
    the foot against the knee joint. Keep the right foot-to-calf contact clear and the right knee, lower leg,
    and foot naturally connected. Keep the pelvis approximately level, the torso upright, and the body weight
    balanced above the standing left foot. Bring both palms together in front of the chest with fingertips pointing
    upward and elbows opening comfortably outward. Keep the shoulders relaxed, the head upright, and the gaze
    level ahead. Observe from directly in front at eye level, keeping the head, hands, open right knee, raised
    right foot, and standing left foot fully inside the frame with a small margin.
  framing: full
  angle: null
  expression: null
  pose: tree
  tags:
  - full
  - yoga
  - tree
- id: yoga_warrior_ii
  text: >-
    Perform Warrior II Pose with the character's right leg forward. Left and right refer to the character's own
    body. Place the right foot toward the left edge of the image and the left foot farther toward the right edge
    in a wide stance. Turn the right toes toward the left edge and angle the rear left foot slightly inward, keeping
    both feet firmly grounded. Bend the right knee over the right ankle, tracking in the same direction as the
    right toes. Keep the rear left leg extended without bending it into a second lunge. Keep the torso upright
    rather than leaning over the front thigh, with the chest open toward the camera. Extend the right arm toward
    the left edge above the right leg and the left arm toward the right edge above the rear leg, forming one long
    horizontal line at shoulder height, palms down. Turn the head toward the right fingertips without twisting
    the torso to follow it. Observe near the front of the chest at natural torso height, with both arms and the
    full wide-legged stance clearly readable. Keep the entire figure from fingertips and head to both feet inside
    the frame with generous lateral margins.
  framing: full
  angle: null
  expression: null
  pose: warrior_ii
  tags:
  - full
  - yoga
  - warrior_ii
- id: yoga_triangle
  text: >-
    Perform Extended Triangle Pose toward the character's right leg. Left and right refer to the character's own
    body. Spread the feet widely, placing the right foot toward the left edge of the image and the left foot toward
    the right edge. Turn the right toes toward the left edge and the left toes slightly inward. Keep both legs
    extended without locking the knees backward. Lengthen the torso over the right leg and then incline it sideways
    toward that leg, rather than rounding the back into a forward fold. Rest the right hand lightly on the right
    shin below the knee, not on the knee joint; do not force the hand to the floor. Extend the left arm upward
    from the shoulder, with the shoulders approximately stacked and the chest open toward the viewer. Keep the
    neck aligned comfortably and the gaze directed forward from the face rather than forcing a look into the lens
    or up at the hand. Observe from the open-chest side with a slight oblique angle so the hand-to-shin contact
    is visible. Keep the head, both hands, both straight legs, and both feet fully inside the frame. The straight
    front knee distinguishes this pose from Extended Side Angle.
  framing: full
  angle: null
  expression: null
  pose: triangle
  tags:
  - full
  - yoga
  - triangle
- id: yoga_low_lunge
  text: >-
    Perform a kneeling Low Crescent Lunge with the character's right leg forward. Left and right refer to the
    character's own body. Direct the body toward the left side of the image. Plant the right foot flat in front
    and bend the right knee approximately above the right ankle. Extend the left leg behind toward the right side
    of the image, with the left knee and the top of the left foot resting on the ground. Keep the pelvis facing
    the same direction as the front leg, and maintain clear contact at the front foot and rear knee. Lift the
    torso upright above the pelvis. Raise both arms overhead at about shoulder width, with open hands facing inward,
    and keep the shoulders away from the ears. Use a long lifted torso with only a mild natural upper-chest opening,
    not an extreme backbend. Keep the head aligned with the torso and look ahead. Observe from a side-front three-quarter
    angle at torso height, showing the front-foot contact, the rear knee on the ground, and the overhead arms
    clearly. Keep the complete figure from fingertips to both feet inside the frame.
  framing: full
  angle: null
  expression: null
  pose: low_lunge
  tags:
  - full
  - yoga
  - low_lunge
- id: yoga_warrior_iii
  text: >-
    Perform Warrior III Pose with the character's left leg supporting the body. Left and right refer to the character's
    own body. Place the entire left sole firmly on the ground, with the standing knee naturally extended and not
    locked backward. Hinge forward from the hips while extending the right leg straight behind. Bring the torso
    and lifted right leg approximately into one long horizontal line, with the lifted right foot staying off the
    ground. Keep the pelvis facing downward rather than opening sideways. Extend both arms forward beyond the
    head at shoulder width, palms facing inward. Keep the arms, torso, and lifted leg reaching in opposing directions
    without arching the lower back. Keep the neck in line with the spine and the gaze down toward the ground rather
    than looking into the camera. Orient the hands and head toward the left edge of the image and the lifted right
    foot toward the right edge. Observe from a slight side-front angle so the two reaching arms can be distinguished
    naturally. Keep the fingertips, supporting left foot, and raised right foot fully inside a sufficiently wide
    frame.
  framing: full
  angle: null
  expression: null
  pose: warrior_iii
  tags:
  - full
  - yoga
  - warrior_iii
- id: yoga_dancer
  text: >-
    Perform the basic one-handed Dancer Pose, not an overhead-grip king-dancer variation. Left and right refer
    to the character's own body. Stand on the left leg with the whole left sole firmly grounded and the knee naturally
    extended. Bend the right knee so the right lower leg rises behind the body. Reach the right hand backward
    and grip the right ankle, keeping this same-side hand-to-ankle connection clear and anatomically continuous.
    Lift the right thigh backward and moderately upward, with the bent right knee pointing down and back rather
    than opening sideways. Incline the torso slightly forward while lifting through the chest. Extend the left
    arm forward at approximately shoulder height, with relaxed fingers. Keep the pelvis approximately facing forward,
    the head aligned with the torso, and the gaze ahead along the forward-reaching arm. Orient the face and reaching
    left hand toward the left edge of the image and the bent lifted right leg toward the right edge. Observe from
    the character's right side with a slight frontward offset, so the right hand's grip on the right ankle remains
    visible. Keep the full body, reaching hand, lifted foot, and standing foot in frame. Use a recognizable moderate
    bow-shaped silhouette rather than an extreme backbend.
  framing: full
  angle: null
  expression: null
  pose: dancer
  tags:
  - full
  - yoga
  - dancer
- id: yoga_half_moon
  text: >-
    Perform Half Moon Pose with the character's left leg as the standing leg. Left and right refer to the character's
    own body. Ground the left foot and extend the standing left leg naturally without locking the knee backward.
    Place the left fingertips on the ground a short distance forward of and slightly outside the left foot, with
    the left wrist approximately below the left shoulder. Extend the right leg behind at approximately hip height,
    keeping the lifted right foot off the ground. Rotate the pelvis and chest open to the side, with the right
    hip above the left hip, rather than keeping the pelvis facing downward as in Warrior III. Reach the right
    arm upward toward the ceiling so the shoulders and arms form a clear vertical line. Keep the neck comfortable
    and the gaze forward from the face rather than forcing the head to turn toward the raised hand or the camera.
    Orient the head and grounded left hand toward the left edge of the image and the raised right leg toward the
    right edge. Observe from the open-chest side at a slight frontward angle, showing the left fingertip contact,
    standing left foot, and lifted right leg as separate structures. Keep the entire figure and both contact points
    fully inside the frame.
  framing: full
  angle: null
  expression: null
  pose: half_moon
  tags:
  - full
  - yoga
  - half_moon
- id: yoga_camel
  text: >-
    Perform a deep Camel Pose with both hands on the back of the pelvis, not a hands-to-heels variation. Left
    and right refer to the character's own body. Kneel with both knees about hip-width apart, both shins and the
    tops of both feet resting on the ground, and the thighs rising vertically above the knees. Place the palms
    against the back of the pelvis with the fingers pointing downward and the elbows drawing toward one another.
    Then arc the torso strongly backward: the chest lifts up and then leans well behind the vertical line of
    the hips, the spine forming a deep continuous curve, the shoulders drawn back and down, and the collarbone
    opened wide. The upper back forms a tall pronounced arch rather than a straight upright torso. Keep the
    thighs vertical and the knees planted so the curve comes from the spine, not from sitting back onto the
    heels. Keep the head in line with the curving spine, dropped back with the chest, the face turned upward
    toward the ceiling, and the throat lengthened; the backbend is the dominant, unmistakable feature of the
    pose. Keep the pelvis above the kneeling base without collapsing the lower back. The hands stay on the
    pelvis and neither hand reaches for a foot or heel. Orient the knees and the front of the body toward the
    left side of the image. Observe from a side-front three-quarter angle at kneeling torso height so the deep
    curve of the spine and the back of the head are both clearly readable, and keep the complete figure inside
    the frame.
  framing: full
  angle: null
  expression: null
  pose: camel
  tags:
  - full
  - yoga
  - camel
- id: yoga_bow
  text: >-
    Perform a deep Bow Pose starting from a prone position with the abdomen facing the ground. Left and right
    refer to the character's own body. Bend both knees and reach both hands backward: the left hand grips the
    left ankle and the right hand grips the right ankle. Keep these two same-side grips separate without
    crossing the arms or swapping the feet. Pull the ankles firmly upward and back toward the head while
    lifting the chest and both thighs high off the ground, so the whole front of the body arches up into a
    strong bow shape. Only the abdomen and the lower belly stay in contact with the ground; the chest, the
    hips, the thighs, and the knees all rise clear of the floor, and the body forms a tall dramatic curve
    balanced on the abdomen. The bent lower legs rise steeply behind and above the hips, the feet close
    together and pointing toward the ceiling, well clear of the head. The arms pull back taut along the
    bow-shaped silhouette, and the head is drawn back with the chest so the face lifts and the gaze angles
    forward and slightly upward. The arch is deep and unmistakable rather than a shallow lift. Orient the
    head toward the left edge of the image and the raised feet toward the right edge. Observe from a low
    side-front three-quarter angle so the near-side grip is clear and the far-side grip is visible as far as
    natural occlusion allows. Do not twist the body or artificially separate the limbs to expose hidden parts.
    Keep the head, hands, knees, and raised feet inside the frame.
  framing: full
  angle: null
  expression: null
  pose: bow
  tags:
  - full
  - yoga
  - bow
