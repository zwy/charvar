# charvar 三动作预设｜红发眼镜女人（熟女通用手部动作三式）
# 用途：**与服装无关**的静态动作预设。熟女套装里有西装、牛仔裤、连衣裙，
#   都没有可提的裙摆——白裙丝袜那套「持裙展开三式」无法通用，本预设三个动作
#   只用手部与手臂，不依赖裙装、不依赖口袋、不依赖任何单件服饰。
# 三个动作：双手抱头（拉伸感，适合针织/毛衣）／双手叉腰（干练，适合西装/衬衫）／
#   单手撩发（柔和，适合裙装/吊带）——三种手臂形态覆盖三类服装。
#
# ★ master_template 刻意**不含** {style_lock_sentence}{identity_lock_sentence}{outfit_lock_sentence}。
#   实测（白裙丝袜那轮，见 subject/白裙丝袜女人_角色开发/动作预设/）：把主体档案锁定项
#   放在动作段前面，ComfyUI 的 Qwen-Image-Edit 会把动作段稀释到 14%，动作**不执行**。
#   身份、画风、服装、鞋全部由 front 参考图承担，动作段独占提示词。
#
# 动作段为单行双引号标量：折叠写法（>-）会在断行处把「，臀」之类拆出空格，normalize 不清这个。
# 三个动作都是正面全身竖构图，画幅 auto（full → 2:3 竖版）。
# caption 标签一律英文（仓库约定，训练信号不中英夹杂；动作段中文不进 caption）。
# tags 的最后一项为动作标识，不是表情标签。参考图用 front 一张。
# 单侧动作（hair_touch_one_hand）的抬起手锁到**画面左侧**；相对角色＝允许镜像，
#   模型每张可挑不同的手，锁到画面位置才有可复现性。
# 动作卡与测试记录见 image-engine：subject/红发眼镜女人_角色开发/动作预设/
#
# 本文件由 image-engine 的 subject/红发眼镜女人_角色开发/生成动作预设.py 生成，
# 改动作段请改脚本后重跑，不要手改（保持与动作卡、prompt-v1.md 逐字一致）。

