# 服装预设：华丽晚宴连衣裙四款，成年角色适用。
# 三款长礼服、一款短裙；中文 text，英文 caption_tags。
# 每条 text 少于200字符，计数包含“服装：”、标点、数字与鞋履描述。
# 仅定义服装与鞋履，不指定人物脸、发型、体型、动作、场景或画风。
# 四款均使用不透明底布，裸腿、无袜；不添加帽子、手套、首饰或手包。
# 水晶扣、水晶缝饰及刺绣属于裙子本身，不属于独立首饰。
# 左右均以穿着者自身为准；开衩高度为目标设定，需出图验收。
# 所有款式均为新设计，尚无服装参考图，未做跨人物或跨模型稳定性测试。
# 人物身份及可辨体态来自角色参考，服装适配人物，不主动改变身材。
# 不延续上一组调试预设的无衣物状态；本组独立使用。
# 如需服装文字前置，应由编译层组装实现；YAML本身不改变最终段落顺序。
# 检查旧 outfit_lock、extra、模板及参考图衣物是否与当前服装冲突。
# 不因换裙子自动移除身份眼镜或发饰；如有需要，另行明确替换范围。
# 本文件已做结构与长度校验，未运行完整仓库或实际生图。

name: glamorous_gala_dresses
type: outfit
version: 1
description: 华丽晚宴连衣裙四款：绯红鱼尾、黑金夜宴、香槟星钻、翡翠流光；三长一短，中文服装描述，每条不超过200字符，设计草案待实测
items:
- id: gala_crimson_mermaid
  label: 绯红鱼尾（露肩缎面长裙）
  text: 服装：该成年角色穿着深绯红不透明厚缎连衣长裙，一字露肩、浅心形领口，胸前少量横向褶皱，自然收腰，腰臀剪裁合体，膝部以下展开鱼尾，后摆带短拖尾；一侧腰部固定一枚小型水晶扣，无开衩。搭配绯红细带凉鞋，约7厘米细跟。裸腿，无袜类，无帽子、手套、首饰或手包。
- id: gala_black_gold_backless
  label: 黑金夜宴（挂颈露背长裙）
  text: 服装：该成年角色穿着黑色不透明丝绒连衣长裙，挂颈、正面窄V领，背部开口止于腰线上方；自然收腰，裙身修长直筒，人物左侧开衩至大腿中段，裙摆不拖地。金色刺绣仅沿领缘与腰侧分布。搭配黑色细带凉鞋，约7厘米细跟。裸腿，无袜类，无帽子、手套、首饰或手包。
- id: gala_champagne_crystal_mini
  label: 香槟星钻（细肩带水晶短裙）
  text: 服装：该成年角色穿着香槟金连衣短裙，不透明底布表面缝缀细小银白水晶，双细肩带、柔和垂褶领口，自然收腰，裙身合体，长度至大腿中段，裙摆采用固定斜向不对称剪裁，无流苏。搭配香槟金细带凉鞋，约6厘米细跟。裸腿，无袜类，无帽子、手套、首饰或手包。
- id: gala_emerald_one_shoulder
  label: 翡翠流光（单肩斜褶长裙）
  text: 服装：该成年角色穿着深翡翠绿不透明厚缎连衣长裙，人物左肩为宽肩带，右肩露出，斜领口；斜向褶皱汇聚于人物右腰，衣身连续无镂空，自然收腰，裙身修长微展，人物右侧开衩至膝上，后摆轻微曳地，无独立披风或飘带。搭配深绿色细带凉鞋，约7厘米细跟。裸腿，无袜类，无帽子、手套、首饰或手包。
