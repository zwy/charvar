title: 双臂上举扶头
category: 立ち
angle: 正面
line: 自建动作
action_text: 人物正面朝向镜头站立，双脚分开与肩同宽，脚掌平踩地面，脚尖朝前，两腿伸直，重心均匀分布在双脚上。躯干直立，骨盆正对镜头，双肩水平。双臂向上抬起，上臂从肩部向斜外上方伸出，与躯干约成一百一十度角，肘部明显高于头顶；两肘向左右斜上方分开，肘尖之间横向距离约为两个肩宽。前臂从肘部向内上方弯曲，两前臂在头顶正上方靠拢，双手在头顶正上方交叠相扣贴在一起，手背朝上。头部完全露在两臂之间，不被手臂遮挡，面部朝向镜头，目光看向镜头。人物从双手到脚底完整入画，双手不接触画面上边缘，头发与双脚都不接触画面边缘。
