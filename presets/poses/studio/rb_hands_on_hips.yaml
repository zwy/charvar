title: 双手叉腰
category: 立ち
angle: 正面
line: 自建动作
action_text: 人物正面朝向镜头站立，双脚分开与肩同宽，脚掌平踩地面，脚尖朝前，两腿伸直，重心均匀分布在双脚上。躯干直立，骨盆正对镜头，双肩水平。双臂向身体两侧打开，上臂从肩部向斜外下方伸出约四十五度，离开躯干，两侧臂下留出可见空隙；肘部向外侧弯曲约九十度，前臂从肘部向内上方斜收回到腰侧。两只手分别按在两侧髋骨上，手掌贴在胯部，手指尖朝前、拇指朝后，手在腰线略下方的位置。两肘明显在躯干轮廓之外，两肘之间横向距离约为三个肩宽。头正对镜头，目光看向镜头。人物从头顶到脚底完整入画，头发与双脚都不接触画面边缘。
