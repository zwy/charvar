pose_id: wss_skirt_hold_stand
source_id: studio
number: S-01
title: 持裙展开·双腿站立
category: 立ち
angle: 正面
line: 自建动作
action_text: 人物正面朝向镜头站立，双脚并拢、鞋底相贴、脚尖朝前，两腿伸直，重心均匀分布在双脚上。躯干直立，双肩水平。双臂从肩部向斜外下方伸出约四十度，两臂伸直，上臂离开躯干，两侧臂下留出可见空隙。双手落在腰部两侧、略低于腰线，明显在身体轮廓之外，两手中点之间的距离约为三个肩宽。两只手各捏住裙摆下缘的一个角，手指向下压在布边之下，把裙摆从腰部向斜外下方拉起并向左右拉开，裙摆在身前横向展开成一道中间下垂的弧，弧的最低处落在大腿中段高度。头正对镜头，目光看向镜头。正面全身入镜，头顶与双脚完整入镜。
aspect: '2:3'
