action_text: >-
  一只猫像人一样双腿直立站在客厅书架前，一只前爪悬在书脊上方蓄势，另一只爪叉腰，眯眼斜睨着面前一排摆好的书。正面全身直视机位，全身含尾完整入镜，书架与地面完整可见。
