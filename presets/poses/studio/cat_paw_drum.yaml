action_text: >-
  一只猫正面朝向镜头端坐在桌面前方，一只前爪高高举到肩膀高度、悬在面前的食碗正上方，
  另一只前爪按在桌面上，身体挺直，尾巴绕到身前拍打桌面。耳朵竖立，视线朝向镜头。
  正面平视的全身视角，猫全身与桌上的食碗完整入镜。全身绷紧蓄势待发，
  下一拍将开始疯狂的敲碗催饭：前爪连珠炮似的拍碗，另一只爪同时拍桌，节奏越来越急。
