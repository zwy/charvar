action_text: >-
  一只猫正面朝向镜头攀在猫爬架平台上部，前双爪扒住平台边缘、上半身探出，
  后腿蹬在平台立柱上蓄力，尾巴向下垂着大幅摆动，耳朵朝前竖立，视线朝向镜头。
  正面平视的全身视角，猫全身、猫爬架平台与立柱完整入镜。全身绷紧蓄势待发，
  下一拍将开始猫爬架上的旋转下扑：蹬柱跃出，空中转体半圈，四爪张开下扑落地，落地后仰头再爬回平台再来一次。
