pose_id: wss_skirt_hold_knee_up
source_id: studio
number: S-02
title: 持裙展开·单膝抬起
category: 立ち
angle: 正面
line: 自建动作
action_text: 人物正面朝向镜头站立，抬起一条腿，正面全身入镜。画面左侧的腿支撑站立，腿伸直，脚掌平踩地面，脚尖朝前，重心完全落在画面左侧的腿上。画面右侧的腿抬起，屈膝，膝盖朝向前方并略低于髋部，小腿向后下方收起，脚尖绷直向下，脚跟抬到接近小腿肚的高度，整条腿离开地面约二十厘米。躯干直立，双肩水平。双臂从肩部向斜外下方伸出约四十度，两臂伸直，上臂离开躯干，两侧臂下留出可见空隙。双手落在腰部两侧、略低于腰线，明显在身体轮廓之外，两手中点之间的距离约为三个肩宽。两只手各捏住裙摆下缘的一个角，手指向下压在布边之下，把裙摆从腰部向斜外下方拉起并向左右拉开，裙摆在身前横向展开成一道中间下垂的弧，弧的最低处落在大腿中段高度。头正对镜头，目光看向镜头。头顶与双脚完整入镜。
