action_text: >-
  一只猫像人一样双腿直立伏在客厅的麻将桌前，双爪捏着一张麻将牌翻来覆去地看，斜眼坏笑盯着镜头像在打坏主意。正面偏低机位的全身视角，全身含尾完整入镜，桌面完整可见。下一拍将开始出千：它假装认真端牌，前爪闪电般把桌上另一张牌盖住换了手里这张，随即双爪一摊装作无事发生；得逞后憋不住拍桌笑到后仰，最后挺起肚子叉腰对镜头贱贱地眯眼定格。
