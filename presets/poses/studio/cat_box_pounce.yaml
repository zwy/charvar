action_text: >-
  一只猫正面朝向镜头蹲伏在纸箱前方，前双爪并拢伸直按地，臀部抬高后腿蓄力，
  背脊拱起，尾巴竖直微抖，耳朵朝前竖立，视线朝向镜头与身前的敞口纸箱。
