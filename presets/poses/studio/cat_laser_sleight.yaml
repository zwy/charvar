action_text: >-
  一只猫像人一样双腿直立站定在客厅电视墙前，一只前爪高高抬起指向空中，摆出蓄力弹指的姿势，另一只爪负手身后，眼睛狡黠地扫向镜头。正面全身直视机位，全身含尾完整入镜，地面完整可见。下一拍将开始魔术：爪子一弹，一颗小红光点凭空落在墙上，它自己先愣了半秒随即扑向墙面抓光点，光点又滑开逗着它绕圈扑空；气喘吁吁停稳后，它猛地回头对镜头瞪眼撇嘴，一副「是你干的吧」的贱样定格。
