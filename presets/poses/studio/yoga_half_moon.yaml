action_text: Perform Half Moon Pose with the character's left leg as the standing leg. Left and right
  refer to the character's own body. Ground the left foot and extend the standing left leg naturally without
  locking the knee backward. Place the left fingertips on the ground a short distance forward of and slightly
  outside the left foot, with the left wrist approximately below the left shoulder. Extend the right leg
  behind at approximately hip height, keeping the lifted right foot off the ground. Rotate the pelvis
  and chest open to the side, with the right hip above the left hip, rather than keeping the pelvis facing
  downward as in Warrior III. Reach the right arm upward toward the ceiling so the shoulders and arms
  form a clear vertical line. Keep the neck comfortable and the gaze forward from the face rather than
  forcing the head to turn toward the raised hand or the camera. Orient the head and grounded left hand
  toward the left edge of the image and the raised right leg toward the right edge. Observe from the character's
  left side, showing the left fingertip contact, standing left foot, and lifted right leg as separate
  structures. Keep the entire figure and both contact points fully inside the frame.
