action_text: >-
  一只猫像人一样双腿直立站在洗衣篮边，一只前爪搭在篮沿蓄势，另一只爪朝前方空地一指划出赛道，下巴扬起一脸跃跃欲试。正面全身直视机位，全身含尾完整入镜，洗衣篮与地面完整可见。
  下一拍将开始飙车：它跳进洗衣篮把篮当车，两爪扒着篮沿让篮子沿地板滑出一道弧线，滑到尽头直冲门框，在门框前堪堪刹住，篮子转了半圈把它甩了出去；它撑爪起身整了整毛，对镜头摆出一副车技惊人的得意定格。
