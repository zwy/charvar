action_text: 人物双脚分开站立，脚尖略向外，双脚接地，膝盖自然放松。身体略侧转，上身向扶腰一侧轻倾，胸部抬起。一臂屈肘，肘部向侧方展开，略高于肩；前臂在耳部高度横向伸向脑后，手掌扶住后脑勺。另一只手扶同侧腰髋，肘部向外。头转向抬臂一侧，下巴略抬，视线斜向上。接近正面的全身视角，头顶、双肘与双脚完整入镜。
