action_text: >-
  一只猫像人一样双腿直立站在玄关地板上，面前铺着一整条透明宽胶带，它一爪捏着胶带一端，另一只爪对着胶带比划讲解，一脸精密策划的表情。正面全身直视机位，全身含尾完整入镜，胶带与地面完整可见。
  下一拍将开始布阵：它把胶带拉平按实四角，绕到旁边蹲好等待猎物；等了两秒毫无动静，它烦躁地迈步过去想检查，一爪踩进自己铺的胶带粘牢拔不出，拽得踉踉跄跄，最后拖着粘爪的胶带对镜头挤出贱笑，定格。
