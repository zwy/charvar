title: 霸座大爷
category: 荒诞猫剧本
angle: 正面
line: 自建动作
action_text: >-
  一只猫像人一样双腿直立站在地铁车厢的一排空座旁，双爪扒着座椅边沿，一只后爪已经翘上座位，斜眼瞟镜头像在宣布这位置归它了。正面偏低机位的全身视角，全身含尾完整入镜，车厢地面完整可见。
  车厢远端一两位乘客剪影虚焦坐着，安静自若，与猫零互动。下一拍将开始霸座：它翻身跃上座椅四仰八叉摊平霸占整排座位，随即像人一样坐起翘着二郎腿抱臂俯视镜头；坐腻了打个大哈欠，整只猫瘫成液体状从座椅边流下，最后就地摊平摆出大爷式瘫姿，冲镜头眯眼贱笑定格。
