action_text: >-
  一只猫正面朝向镜头用两条后腿直立站立，后爪小步分开踩地，一只前爪托在头顶上方稳稳顶住一个小圆托盘，
  另一只前爪向侧平伸保持平衡，尾巴向后伸直微翘，耳朵竖立，视线朝向镜头。
  正面平视的全身视角，猫全身与头顶的托盘完整入镜。全身绷紧蓄势待发，
  下一拍将开始侍应猫的托盘滑步：两条后腿小步流星横向滑行，头顶托盘稳稳不落，转一个圈再来回一趟。
