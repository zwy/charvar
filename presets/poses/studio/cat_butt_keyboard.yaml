action_text: >-
  一只猫像人一样双腿直立站在书桌上，身前的笔记本电脑开着一屏文档，它一爪扶着屏幕沿蓄势，另一只爪朝身后的键盘一指，回头对镜头挤眼。正面全身直视机位，全身含尾完整入镜，书桌与电脑完整可见。
  下一拍将开始捣乱：它转身一屁股坐进键盘，尾巴扫过按键滚出一长串乱码，还扭着屁股在键盘上蹭了两下把字越蹭越多；随后它起身对着屏幕左右端详，抬爪在键盘上煞有介事敲了两下，装作全是它精心整理的文档，挑眉定格。
