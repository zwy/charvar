action_text: >-
  一只猫正面朝向镜头站在电子琴键盘前方，一只前爪抬到胸口高度踩在琴键上，
  另一只前爪举到头顶高度张开待按，头微仰，尾巴甩向画面一侧，耳朵竖立，视线朝向镜头。
  正面平视的全身视角，猫全身与身前的电子琴完整入镜。全身绷紧蓄势待发，
  下一拍将开始疯狂的琴键踩奏：前爪在琴键上交替连按，脑袋随节奏点头甩动，越弹越狂热。
