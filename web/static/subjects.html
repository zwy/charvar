<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>charvar · 主体</title><link rel="stylesheet" href="/static/style.css"><link rel="icon" type="image/svg+xml" href="/static/favicon.svg"><link rel="alternate icon" type="image/png" sizes="1024x1024" href="/static/icon.png"><link rel="apple-touch-icon" href="/static/icon.png"></head><body>
<!-- 真多页页面文件：顶栏由 nav.js 渲染；分组容器只用 .form-section（见 .superdesign/design-system.md）。
     脚本清单见文件尾；加新页 = 本文件 + nav.js NAV_PAGES + charvar/api.py 路由表三处同步 -->
<header class="topbar"></header>
<main>
<section id="page-subjects">
<!-- 上半：主体档案库（列表 + 详情表单），与人脸/动作/服饰库同一套 master-detail 骨架。
     建档统一走 CLI（charvar subject add），页面不提供新建 / 导入入口 -->
<div class="card"><div class="row-head"><h2>主体档案</h2><span id="subject-page-stat" class="hint"></span></div>
<div class="subject-browser subject-browser-page">
<div class="subject-master">
<div class="subject-toolbar">
<div class="subject-toolbar-row">
<input id="subject-q" type="search" placeholder="按 id / 显示名 / 锁定项 搜索（中/英均可）">
</div>
</div>
<div id="subject-list" class="subject-grid"></div>
</div>
<div id="subject-detail" class="subject-detail">
<div id="subject-detail-empty" class="subject-detail-empty" hidden>在左侧选择一个主体</div>
<div id="subject-form" hidden>
<div class="subject-detail-titles"><h3 id="subject-detail-name"></h3><div id="s-id" class="subject-detail-id"></div></div>
<div class="form-section"><div class="form-section-title">基本信息</div><div class="form-grid">
<label>显示名<input type="text" id="s-name"></label>
<label>称谓（提示词里的人称）<input type="text" id="s-noun" value="person" placeholder="woman / man / cat"></label>
<label>LoRA 触发词<input type="text" id="s-trigger" placeholder="留空 = 不用触发词"></label>
</div></div>
<div class="form-section"><div class="form-section-title">锁定项<span class="hint">每行一条，拼成一句 Maintain … 进提示词；中英文皆可</span></div><div class="form-grid lock-grid">
<label>风格锁定<textarea id="s-style" rows="4" placeholder="2d comic book style"></textarea></label>
<label>外貌锁定<textarea id="s-identity" rows="4" placeholder="long silver-white hair"></textarea></label>
<label>体型锁定（换装体量锚）<textarea id="s-body" rows="4" placeholder="a very large, full, round bust"></textarea></label>
<label>服饰锁定<textarea id="s-outfit" rows="4" placeholder="the black witch robe"></textarea></label>
</div></div>
<div class="form-section"><div class="form-section-title">补充</div><div class="form-grid">
<label class="full-row">自由补充（拼到主提示词末尾）<input type="text" id="s-extra"></label>
</div></div>
<div class="actions"><button id="btn-subject-save" class="primary">保存</button><button id="btn-subject-delete" class="danger">删除</button><span id="subject-form-status" class="status"></span></div>
</div>
</div>
</div>
</div>
<!-- 下半：五槽位档案图 + 通用提示词模板，随选中主体展示 -->
<div class="card" id="subject-images-card" hidden><div class="row-head"><h2>档案图片</h2><span class="hint">生成变体时可作参考图</span></div>
<div class="slot-toolbar">
<span class="hint">先就绪「人物半身像＋三视图」，再生成 / 上传其余 4 种。</span>
<div class="actions">
<label class="check seed-inline">统一种子<input type="number" id="slot-seed" value="0"></label>
<button id="btn-slot-seed-random" type="button" class="btn-sm" title="随机生成一个种子（0–100000）">随机种子</button>
<button id="btn-slots-draft" class="btn-sm">一键 AI 起草（只补空白）</button>
<span id="slot-toolbar-status" class="status"></span>
</div>
</div>
<div id="subject-image-slots" class="slot-grid"></div></div>
<div class="card" id="template-card" hidden><div class="row-head"><h2>角色全场景通用提示词模板</h2><span class="hint">markdown · LLM 改写时的参考资料</span></div>
<div class="actions"><button id="btn-template-edit" class="primary">编辑模板（弹窗）</button><label class="btn file-btn">从 .md 文件载入<input type="file" id="template-file" accept=".md,.markdown,.txt" hidden></label><span id="template-status" class="status"></span></div>
<div id="template-md-view" class="md-view" hidden></div></div>
</section>
</main><script src="/static/core.js"></script><script src="/static/nav.js"></script><script src="/static/media.js"></script><script src="/static/subjects.js"></script></body></html>
