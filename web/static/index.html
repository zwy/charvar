<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>charvar · 角色变体提示词生成器</title><link rel="stylesheet" href="/static/style.css"></head><body>
<header class="topbar"><div class="brand">charvar <span class="sub">角色变体提示词生成器</span></div><nav>
<button class="tab active" data-tab="gen">生成</button><button class="tab" data-tab="subjects">主体档案</button><button class="tab" data-tab="runs">历史记录</button></nav></header>
<main>
<section id="tab-gen" class="tab-page active"><div class="card"><h2>生成参数</h2><div class="form-grid">
<label>主体档案<select id="gen-subject"></select></label>
<label>预设<select id="gen-preset"></select></label>
<label>种子<input type="number" id="gen-seed" value="42"></label>
<label>条数<input type="number" id="gen-count" placeholder="留空 = 预设全部" min="1"></label>
<label>采样<select id="gen-sampling"><option value="all">all（默认顺序）</option><option value="first">first（取前 N 条）</option><option value="random">random（按种子抽取）</option></select></label>
<label>拼接分隔符<input type="text" id="gen-separator" value=" "></label>
<label class="check"><input type="checkbox" id="gen-rand-bg" checked> 随机背景</label>
<label class="check"><input type="checkbox" id="gen-rand-light" checked> 随机光照</label>
<label>固定背景（留空随机）<input type="text" id="gen-fixed-bg" list="bg-options"><datalist id="bg-options"></datalist></label>
<label>固定光照（留空随机）<input type="text" id="gen-fixed-light" list="light-options"><datalist id="light-options"></datalist></label>
</div><div class="actions"><button id="btn-generate" class="primary">生成变体</button><span id="gen-status" class="status"></span></div></div>
<div class="card" id="result-card" hidden><div class="row-head"><h2>生成结果 <span id="result-summary"></span></h2><div class="actions">
<button id="btn-copy-prompts">复制全部提示词</button><button id="btn-copy-captions">复制全部 caption</button>
<a id="dl-txt" class="btn" hidden>下载 TXT</a><a id="dl-jsonl" class="btn" hidden>下载 JSONL</a><a id="dl-zip" class="btn" hidden>下载 captions.zip</a><button id="btn-toggle-comfy">推送 ComfyUI…</button></div></div>
<div id="comfy-panel" class="comfy-panel" hidden><div class="form-grid">
<label>ComfyUI 地址<input type="text" id="comfy-url" value="http://127.0.0.1:8188"></label>
<label>Workflow（data/workflows 成对文件）<select id="comfy-workflow"></select></label>
<div class="form-field">
<div class="field-label">画幅比例</div>
<div id="comfy-aspect" class="chip-row">
<button id="comfy-aspect-auto" class="chip active" data-ratio="auto" type="button" data-label="智能">智能</button>
<button id="comfy-aspect-1-1" class="chip" data-ratio="1:1" type="button" data-label="1:1">1:1</button>
<button id="comfy-aspect-3-4" class="chip" data-ratio="3:4" type="button" data-label="3:4">3:4</button>
<button id="comfy-aspect-16-9" class="chip" data-ratio="16:9" type="button" data-label="16:9">16:9</button>
<button id="comfy-aspect-4-3" class="chip" data-ratio="4:3" type="button" data-label="4:3">4:3</button>
<button id="comfy-aspect-9-16" class="chip" data-ratio="9:16" type="button" data-label="9:16">9:16</button>
<button id="comfy-aspect-2-3" class="chip" data-ratio="2:3" type="button" data-label="2:3">2:3</button>
<button id="comfy-aspect-3-2" class="chip" data-ratio="3:2" type="button" data-label="3:2">3:2</button>
<button id="comfy-aspect-21-9" class="chip" data-ratio="21:9" type="button" data-label="21:9">21:9</button>
</div>
</div>
<label>分辨率档位<select id="comfy-resolution">
<option value="1k">1K（长边 1024）</option><option value="2k">2K（长边 2048）</option><option value="4k">4K（长边 4096）</option></select></label>
<span id="comfy-dim-preview" class="hint"></span>
<label class="span2">负向提示词（可选，mapping 需配 field=negative_prompt）<input type="text" id="comfy-negative"></label>
<label class="check"><input type="checkbox" id="comfy-wait"> 等待完成并记录输出文件名</label>
</div><div class="actions"><button id="btn-comfy-status">检查连接</button><button id="btn-comfy-queue" class="primary">逐条入队</button><span class="hint">workflow 必须是 ComfyUI「导出 (API)」格式 + 同名 mapping.json。</span></div><pre id="comfy-result" class="log"></pre></div>
<div class="media-toolbar">
      <button id="btn-sync-images" class="chip">同步图片</button>
      <button id="btn-view-images" class="chip active" aria-pressed="true">图片墙</button>
      <button id="btn-view-table" class="chip" aria-pressed="false">表格</button>
      <button id="btn-contact-sheet" class="chip">Contact sheet</button>
      <span id="image-status" class="status"></span>
    </div>
    <div id="result-images" class="image-grid"></div>
<div class="table-wrap" id="result-table-wrap"><table id="result-table"><thead><tr><th>#</th><th>变体</th><th>景别</th><th>角度</th><th>表情</th><th>背景</th><th>光照</th><th>最终提示词</th><th>caption</th></tr></thead><tbody></tbody></table></div></div></section>
<section id="tab-subjects" class="tab-page"><div class="card"><h2>主体档案</h2><ul id="subject-list" class="subject-list"></ul><div class="actions"><button id="btn-subject-new">+ 新建</button></div></div><div class="card"><h2 id="subject-form-title">档案详情</h2><div class="form-grid">
<label>ID（slug）<input type="text" id="s-id" placeholder="silver_witch"></label>
<label>显示名<input type="text" id="s-name"></label>
<label>称谓（提示词里的人称）<input type="text" id="s-noun" value="person" placeholder="woman / man / cat"></label>
<label>LoRA 触发词<input type="text" id="s-trigger"></label>
<label>参考图占位<input type="text" id="s-ref" value="<image1>"></label>
<label>风格锁定（Maintain 每行一条）<textarea id="s-style" rows="3" placeholder="2d comic book style"></textarea></label>
<label>外貌锁定（每行一条）<textarea id="s-identity" rows="4" placeholder="long silver-white hair"></textarea></label>
<label>服饰锁定（每行一条）<textarea id="s-outfit" rows="3" placeholder="the black witch robe"></textarea></label>
<label class="span2">自由补充（拼到主提示词末尾）<input type="text" id="s-extra"></label>
</div><div class="actions"><button id="btn-subject-save" class="primary">保存</button><button id="btn-subject-delete" class="danger">删除</button></div>
<details class="import-box"><summary>粘贴 YAML 导入档案</summary><textarea id="s-yaml" rows="8" placeholder="id: silver_witch&#10;name: 银白女巫&#10;subject_noun: woman&#10;trigger_word: sw1tch&#10;style_lock: [the original illustration style]&#10;identity_lock: [long silver-white hair]&#10;outfit_lock: [the black witch robe]"></textarea><div class="actions"><button id="btn-subject-import">解析并保存</button></div></details></div></section>
<section id="tab-runs" class="tab-page"><div class="card"><h2>生成历史</h2><div class="table-wrap"><table id="runs-table"><thead><tr><th>run_id</th><th>主体</th><th>预设</th><th>种子</th><th>条数</th><th>ComfyUI</th><th>时间</th><th>操作</th></tr></thead><tbody></tbody></table></div><div class="actions"><button id="btn-runs-refresh">刷新</button></div></div></section>
</main><script src="/static/media.js"></script><script src="/static/app.js"></script></body></html>
