[project]
name = "charvar"
version = "0.1.0"
description = "角色变体提示词生成器：把 ComfyUI Q21 工作流的「主提示词 + 角度/表情变体 + 随机背景光照」逻辑抽离为独立可复用模块"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "typer>=0.12",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
charvar = "charvar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["charvar", "web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
